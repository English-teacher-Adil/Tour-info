 in Kazakhstan today is much broader and highly multicultural.","notice":["Horse meat has high ceremonial status but is not eaten at every meal.","Qazy is a horse-rib meat and fat sausage preparation.","Tea may be more important to everyday domestic life than kumis."],"story":"Traditional Kazakh cuisine and the food people eat every day in Kazakhstan are not the same category. Plov, lagman, pelmeni, Korean salads, sushi and coffee can all belong to an ordinary week.","myth":"Meat-serving customs and tea habits vary by family and region, so highly precise charts of who always receives which bone or exactly how much tea must be poured can be misleading.","deep":"Fermented dairy includes kumis, shubat, ayran and qurt. Bread carries strong respect norms, while modern food reflects Central Asian, Russian, Uyghur, Dungan, Koryo-saram and global influences.","tags":["food","beshbarmak","et","qazy","horse meat","kumis","tea","baursak"],"image":"images/food.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Kazakh_beshbarmak.jpg/960px-Kazakh_beshbarmak.jpg","photoKey":"food"},{"id":"horse-culture","section":"kazakhstan","category":"Horse culture","icon":"🐎","title":"Horse Culture","subtitle":"Important, deep — and easy to oversimplify","meta":["riding • racing • milk • meat","Botai debate"],"summary":"Horses were central to pastoral mobility, warfare, communication, racing, status, food and language, but modern archaeological debates make simple origin stories risky.","notice":["Botai provides very early evidence of intensive human–horse relationships.","Modern domestic horses do not appear to descend mainly from Botai horses.","Kokpar, baige, audaryspaq, qyz kuu and tenge ilu survive as modern organised or festival sports."],"story":"The more interesting Botai story is uncertainty: one of the world’s earliest intense horse–human relationships may not be the direct ancestor of today’s domestic horse.","myth":"Botai is one of the world’s most important early horse sites, but current archaeology does not support the simple claim that Kazakhstan definitively invented the modern domestic horse.","deep":"Treat equestrian games as both historical skill traditions and living modern sports with rules, federations and performance contexts.","tags":["horse","botai","kokpar","baige","qyz kuu","tenge ilu"],"image":"images/horse-culture.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Kokpar_game_of_nomads.jpg/960px-Kokpar_game_of_nomads.jpg","photoKey":"kokpar"},{"id":"music","section":"kazakhstan","category":"Music","icon":"🎵","title":"Dombra, Küy & Oral Music","subtitle":"Instrumental music that can carry a story","meta":["dombra","küy","aitys"],"summary":"The dombra is a normally two-stringed long-necked lute, and a küy is an instrumental composition that can carry story, memory, landscape or emotion.","notice":["Kurmangazy is central to the western tökpe tradition.","Tattimbet is associated with the central/eastern shertpe tradition.","Aitys is improvised poetic competition."],"story":"A küy is not simply 'a song without words': performance traditionally comes with narratives, legends and historical associations.","myth":"The kobyz has important sacred and ritual associations, but its history is much broader than 'a shaman instrument'. Tökpe and shertpe are useful musical traditions, not rigid boxes.","deep":"The Soviet period both suppressed and institutionalised music through notation, orchestras, conservatories and standardised stage repertoires.","tags":["dombra","kuy","music","aitys","kobyz","kurmangazy"],"image":"images/music.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Kazakh_Dombra.jpg/960px-Kazakh_Dombra.jpg","photoKey":"dombra"},{"id":"islam","section":"kazakhstan","category":"Religion","icon":"☪️","title":"Islam in Kazakhstan","subtitle":"Muslim identity inside a strongly secular modern state","meta":["Hanafi tradition","constitutionally secular"],"summary":"Kazakhstan is majority Muslim by identity, but religious practice ranges from observant to cultural, selective, secular and non-religious.","notice":["Islam developed through Turkic steppe culture, Sufism, the Russian Empire and Soviet secularisation.","Religious life did not simply disappear during the Soviet period.","Russian Orthodox and other Christian communities are also part of the country."],"story":"Kazakhstan’s religious life looks different from the Gulf because its history is different: steppe Islam, Sufism, the Russian Empire, Soviet secularisation and post-1991 revival all shaped the present.","myth":"Kazakhstan’s Islam has developed through steppe culture, Sufism, imperial rule, Soviet secularisation and post-1991 revival. It cannot be reduced either to 'always strictly Muslim' or 'really Tengriist'.","deep":"Religious identity and observance vary enormously; a constitutionally secular state and a Muslim cultural majority coexist without contradiction.","tags":["islam","religion","secular","hanafi","sufism","orthodox"],"image":"images/islam.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Zharkent_Mosque_2.jpg/960px-Zharkent_Mosque_2.jpg","photoKey":"zharkent"},{"id":"clothing-ornament","section":"kazakhstan","category":"Material culture","icon":"🧵","title":"Clothing & Ornament","subtitle":"Status, region and ceremony matter more than one national costume","meta":["shapan","saukele","qoshqar müyiz"],"summary":"Kazakh clothing historically varied by gender, age, wealth, region and season, while modern heritage presentation often standardises it into one 'national costume.'","notice":["Shapan is a robe or coat; taqiya a skullcap; tymaq warm fur headwear.","Saukele is an elaborate bridal headdress associated especially with elite ceremonial display.","Qoshqar müyiz, the ram’s-horn motif family, is widespread in decorative art."],"story":"A spectacular museum costume shows ceremony, craft and status, but it should not be mistaken for what every Kazakh person wore every day.","myth":"Traditional clothing changed by age, region, wealth and occasion, and decorative motifs can carry several meanings rather than one fixed ancient dictionary definition.","deep":"Ornament appears across felt, carpets, embroidery, leather, wood, metalwork and jewellery.","tags":["clothing","ornament","saukele","shapan","qoshqar muyiz","textiles"],"image":"images/clothing-ornament.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Traditional_costume_for_Nowruz.JPG/960px-Traditional_costume_for_Nowruz.JPG","photoKey":"nauryz"},{"id":"sports-eagle","section":"kazakhstan","category":"Traditions","icon":"🦅","title":"Traditional Sports & Eagle Hunting","subtitle":"Shared Inner Asian heritage, not a universal everyday lifestyle","meta":["kokpar","kazakh kures","burkitshilik"],"summary":"Kazakhstan’s traditional sports include wrestling, strategic games, equestrian competitions and specialist falconry traditions.","notice":["Togyzqumalaq is a codified strategy game.","Kazakh kures is traditional jacket/belt wrestling with modern rules.","Golden-eagle hunting was a specialist practice, especially associated with eastern and mountain environments."],"story":"Eagle hunting is real, but its modern festival and tourism form is also part of a contemporary heritage economy.","myth":"Eagle hunting was a specialist tradition rather than an everyday skill of all Kazakhs. Its modern festivals and tourism presentations are also part of how the tradition lives today.","deep":"Many 'national' sports are also transnational Inner Asian traditions shared in related forms with neighbouring peoples.","tags":["eagle hunting","burkitshilik","kazakh kures","togyzqumalaq","sport"],"image":"images/sports-eagle.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Kokpar_game_of_nomads.jpg/960px-Kokpar_game_of_nomads.jpg","photoKey":"kokpar"},{"id":"nauryz","section":"kazakhstan","category":"Festival","icon":"🌱","title":"Nauryz","subtitle":"Ancient spring festival, modern national celebration","meta":["spring equinox world","Nauryz kozhe"],"summary":"Nauryz belongs to the broad Nowruz cultural world and has been reshaped over centuries by Turkic practice, Soviet restriction and post-independence revival.","notice":["Nauryz kozhe is associated with seven components, but there is no single universal recipe.","Public celebration was marginalised for much of the Soviet period before late-Soviet revival.","Modern celebrations combine yurts, food, concerts, sports and national clothing."],"story":"Nauryz is ancient, but the way it is celebrated in public Kazakhstan today is also modern.","myth":"Nauryz has deep historical roots, while many features of today’s public festival were revived, standardised or redesigned in the late Soviet and independence periods.","deep":"Some elements are continuity, some are revival and some are modern festival design; that mixture is exactly what makes Nauryz interesting.","tags":["nauryz","nowruz","festival","spring","nauryz kozhe","holiday"],"image":"images/nauryz.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Traditional_costume_for_Nowruz.JPG/960px-Traditional_costume_for_Nowruz.JPG","photoKey":"nauryz"},{"id":"russian-empire","section":"kazakhstan","category":"History","icon":"🏰","title":"Kazakhstan & the Russian Empire","subtitle":"A long incorporation process, not one conquest on one date","meta":["18th–19th centuries","forts • settlement • reforms"],"summary":"Russian incorporation of the Kazakh steppe developed gradually through diplomacy, military lines, administrative change, settlement and the dismantling of indigenous political authority.","notice":["Different Kazakh rulers initially entered varying relationships with the Russian crown.","Imperial forts and settlement expanded over time.","Kenesary Qasymuly’s revolt is now strongly remembered as an anti-colonial struggle and defence of khan authority."],"story":"The useful point is that incorporation changed form over time: alliance, protection, frontier pressure and imperial domination were not the same thing.","myth":"Kazakhstan’s incorporation into the Russian Empire was a long process involving alliance, frontier expansion, administrative control, settlement and eventually imperial domination.","deep":"This imperial layer helps explain why Russian language, frontier towns and administrative institutions were already deeply rooted before the Soviet period.","tags":["russian empire","kenesary","colonial","history","forts"],"image":"images/russian-empire.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Ascension_Cathedral,_Almaty.jpg/960px-Ascension_Cathedral,_Almaty.jpg","photoKey":"cathedral"},{"id":"soviet-kazakhstan","section":"kazakhstan","category":"History","icon":"☭","title":"Soviet Kazakhstan","subtitle":"Destruction, modernisation and memory at the same time","meta":["collectivisation","deportations","industry","everyday life"],"summary":"The Soviet period cannot be reduced to either 'the Soviets destroyed Kazakhstan' or 'the Soviets modernised Kazakhstan.' Both capture real parts of a much more complicated transformation.","notice":["Collectivisation and forced sedentarisation contributed to catastrophic famine.","Kazakhstan became a destination for deported peoples and Gulag prisoners.","Soviet rule also built mass schooling, industry, cities, sports institutions and technical infrastructure."],"story":"One of the best ways to understand the USSR is through ordinary institutions: apartment districts, schools, sports clubs, sanatoria, mountaineering groups and Palaces of Culture.","myth":"There is no single Kazakh attitude toward the Soviet Union.","deep":"The same system that violently disrupted older social worlds also produced much of the urban, scientific, educational and infrastructural landscape visible today.","tags":["soviet","ussr","famine","deportations","industrialisation","memory"],"image":"images/soviet-kazakhstan.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/%D0%97%D0%B4%D0%B0%D0%BD%D0%B8%D0%B5_%D0%A1%D0%BE%D0%B2%D0%BD%D0%B0%D1%80%D0%BA%D0%BE%D0%BC%D0%B0_%D0%9A%D0%B0%D0%B7%D0%90%D0%A1%D0%A1%D0%A0_(%D0%90%D0%BB%D0%BC%D0%B0-%D0%90%D1%82%D0%B0)-3.jpg/960px-%D0%97%D0%B4%D0%B0%D0%BD%D0%B8%D0%B5_%D0%A1%D0%BE%D0%B2%D0%BD%D0%B0%D1%80%D0%BA%D0%BE%D0%BC%D0%B0_%D0%9A%D0%B0%D0%B7%D0%90%D0%A1%D0%A1%D0%A0_(%D0%90%D0%BB%D0%BC%D0%B0-%D0%90%D1%82%D0%B0)-3.jpg","photoKey":"soviet"},{"id":"wwii","section":"kazakhstan","category":"Soviet memory","icon":"🎖️","title":"World War II & Panfilov Memory","subtitle":"Real sacrifice and a perfected wartime legend","meta":["316th Rifle Division","Great Patriotic War memory"],"summary":"Kazakhstan contributed soldiers, industry and wartime labour, while the Panfilov Division became one of the most powerful Soviet heroic narratives.","notice":["The division genuinely fought costly battles in the defence of Moscow.","The exact canonical story of 28 men all dying after destroying a fixed number of tanks was later challenged by archival investigation.","Bauyrzhan Momyshuly, Manshuk Mametova and Aliya Moldagulova remain major figures in public memory."],"story":"The respectful distinction is between the real courage and losses of the division and the perfected journalistic legend of exactly twenty-eight men.","myth":"The Panfilov legend can be examined critically without dismissing the very real wartime losses and sacrifice remembered in Kazakhstan.","deep":"WWII memory remains socially important, so accuracy and tone matter equally.","tags":["wwii","panfilov","momyshuly","soviet memory","war"],"image":"images/wwii.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Ascension_Cathedral,_Almaty.jpg/960px-Ascension_Cathedral,_Almaty.jpg","photoKey":"cathedral"},{"id":"independence","section":"kazakhstan","category":"Modern history","icon":"","title":"Independence after 1991","subtitle":"State-building after the Soviet collapse","meta":["independence 1991","tenge • Astana • nation-building"],"summary":"Kazakhstan became independent in December 1991 and then faced economic dislocation, institution-building, privatisation, migration and the creation of new national symbols.","notice":["The tenge replaced the ruble as national currency.","The capital moved from Almaty to Akmola, later Astana.","The Nazarbayev era combined oil-led growth and state-building with highly concentrated political power."],"story":"For many families, the 1990s are remembered less as an abstract geopolitical transition than as inflation, job insecurity, new business opportunities and sudden social change.","myth":"The post-1991 story combines state-building, economic growth, new national symbols and stronger Kazakh-language visibility with concentrated political power and inequality.","deep":"Post-1991 Kazakhstan combines language revival, new symbols, global investment, new urban forms and continued Soviet institutional legacies.","tags":["independence","1991","tenge","astana","nazarbayev","modern history"],"image":"images/independence.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"language","section":"kazakhstan","category":"Language","icon":"🗣️","title":"Kazakh, Russian & Bilingual Life","subtitle":"Why language choice is more complicated than it looks","meta":["Kazakh = state language","Russian officially used alongside"],"summary":"Kazakhstan is intensely bilingual in many settings: Kazakh is the state language, while Russian remains deeply embedded in family life, business, media and urban history.","notice":["Russian became powerful through imperial administration, Soviet education, science, mobility and urban careers.","Kazakh has expanded strongly in institutions and culture since independence.","Code-switching and multilingual repertoires are common, especially in large cities."],"story":"A person can speak Russian at work, Kazakh with grandparents and English online without experiencing that as an identity crisis.","myth":"Russian is not legally 'the second state language', but it is also not simply a foreign language nobody should speak.","deep":"The alphabet has moved through Arabic, early Soviet Latin and Cyrillic; the proposed Latin transition has proceeded much more slowly than early announcements suggested.","tags":["kazakh language","russian","bilingualism","alphabet","identity"],"image":"images/language.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"ethnic-diversity","section":"kazakhstan","category":"Society","icon":"🌍","title":"Ethnic Diversity","subtitle":"A real multicultural society shaped by both mobility and coercion","meta":["Kazakhs majority","Russians • Uzbeks • Uyghurs • Koreans • others"],"summary":"Kazakhstan is genuinely multiethnic, but that diversity was produced by very different historical processes: settlement, labour migration, industrialisation, deportation, wartime evacuation and later mobility.","notice":["Kazakhs are the large majority today.","Russians remain the largest minority.","Uyghur, Uzbek, Korean, German, Tatar, Dungan and many other communities have distinct histories."],"story":"One of the strongest everyday examples is Koryo-saram food: 'Korean salads' in Kazakhstan grew from the experience of Soviet Koreans deported to Central Asia.","myth":"The slogan that '130 nationalities live peacefully together' is a state multicultural narrative, not a complete social-science explanation.","deep":"The country’s diversity includes both cooperation and histories of coercion; both deserve space in the explanation.","tags":["ethnic diversity","russians","uyghurs","koreans","koryo saram","society"],"image":"images/ethnic-diversity.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"modern-family","section":"kazakhstan","category":"Modern life","icon":"👨‍👩‍👧","title":"Family Life Today","subtitle":"Obligation and individualism negotiated family by family","meta":["multigenerational • nuclear • mixed","changing gender roles"],"summary":"Modern family life ranges from multigenerational households and strong kin obligations to independent urban couples, late marriage and highly individualised lifestyles.","notice":["Grandparents can play a very visible role in childcare.","Large weddings remain socially important in many families.","Women are strongly represented in education and professional life while gendered domestic expectations can also persist."],"story":"A more accurate picture is diversity: traditional expectations can remain influential while couples and families negotiate them in very different ways.","myth":"There is no single model of a 'Kazakh family' today. Multigenerational homes, independent couples, strong kin obligations and highly individual lifestyles all exist.","deep":"Contemporary family life is better understood as negotiation: region, class, language, religion and generation all change the balance.","tags":["family","modern life","grandparents","gender","marriage","urban"],"image":"images/modern-family.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"urban-kazakhstan","section":"kazakhstan","category":"Modern life","icon":"☕","title":"Modern Urban Kazakhstan","subtitle":"The fastest way to break the 'nomadic post-Soviet' stereotype","meta":["specialty coffee","startups • climbing gyms • Q-pop"],"summary":"A visitor to Almaty quickly encounters brunch restaurants, malls, coworking spaces, Korean cosmetics, delivery apps, climbing gyms, ski culture and late-night cafés.","notice":["Modern urban life does not mean traditional culture disappeared.","Kazakh-language content can grow at the same time as global cultural consumption.","Russian, Kazakh and English may all appear in one person’s day."],"story":"A young Almaty resident can drink a flat white, attend betashar, ski at Shymbulak, celebrate Nauryz and eat Korean salad without seeing contradiction.","myth":"Modern Kazakhstan is not a tug-of-war between 'tradition' and 'modernity'. Those layers often coexist naturally in the same person, family and city.","deep":"Its modernity is itself layered: Kazakh, Soviet/post-Soviet, Islamic, Russian-speaking, Turkic and global.","tags":["modern almaty","urban","coffee","qpop","globalisation","youth"],"image":"images/urban-kazakhstan.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"youth-education","section":"kazakhstan","category":"Modern life","icon":"🎓","title":"Youth & Education","subtitle":"More Kazakh-language-conscious and more global at the same time","meta":["Q-pop • study abroad • English","Bolashak"],"summary":"Urban youth culture combines increased Kazakh-language content, Russian media, English/global internet culture, Korean influence, entrepreneurship, fitness and international education ambitions.","notice":["Rural/urban, class and regional differences are large.","Bolashak became a major symbol of state-funded study abroad.","Education often functions as status, mobility, family investment and access to international careers."],"story":"The interesting trend is not simply Westernisation: many young people can become more Kazakh-language-conscious while also becoming more globally connected.","myth":"Young people in Almaty, rural villages, northern cities and western oil regions can have very different languages, ambitions and lifestyles.","deep":"Independent Kazakhstan expanded Kazakh-medium, English-language and international education on top of a strong Soviet legacy of mass schooling and technical education.","tags":["youth","education","bolashak","qpop","english","study abroad"],"image":"images/youth-education.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"economy","section":"kazakhstan","category":"Modern Kazakhstan","icon":"⛽","title":"Economy","subtitle":"Resource-rich, relatively wealthy — and uneven","meta":["oil • uranium • mining","upper-middle-income"],"summary":"Kazakhstan is economically larger per capita than several Central Asian neighbours because of major natural-resource wealth and large-scale investment since the 1990s.","notice":["Oil and gas remain central.","Uranium, copper, metallurgy, agriculture, logistics, finance and services also matter.","Almaty and Astana concentrate high-paying services and premium consumption."],"story":"A visitor can easily mistake central Almaty prices and lifestyles for national living standards; the country’s regional inequality is substantial.","myth":"Kazakhstan is resource-rich, but oil and mining wealth is distributed unevenly and does not make everyday life uniformly affluent across the country.","deep":"Diversification is real but incomplete, and extractive sectors remain highly important to exports and state revenue.","tags":["economy","oil","uranium","mining","almaty","inequality"],"image":"images/economy.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"russia-china","section":"kazakhstan","category":"Geopolitics","icon":"🧭","title":"Kazakhstan, Russia & China","subtitle":"Geography makes 'choose one side' a poor explanation","meta":["borders both powers","multi-vector diplomacy"],"summary":"Kazakhstan’s foreign policy has long tried to maintain useful relations with Russia, China, Central Asian neighbours, Europe, the United States, Turkey and others.","notice":["Russia matters through the long border, language, trade, energy and Soviet history.","China matters through trade, infrastructure, transit, energy and the Xinjiang border.","Public attitudes toward both powers are varied and cannot be reduced to pro/anti labels."],"story":"The geographical fact comes first: Kazakhstan literally sits between two major powers, so diversification of relationships is a practical state strategy.","myth":"Kazakhstan is a sovereign state with deep ties to both Russia and China. Trade, language and geography are not simple signs of political control by either neighbour.","deep":"The phrase 'multi-vector' is most useful when explained as diversified relationships rather than absolute neutrality.","tags":["russia","china","geopolitics","multi vector","foreign policy","trade"],"image":"images/russia-china.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Ili_river.jpg/960px-Ili_river.jpg","photoKey":"ili"},{"id":"koryo-saram","section":"kazakhstan","category":"Ethnic diversity","icon":"🥕","title":"Koryo-saram","subtitle":"How Stalinist deportation became part of everyday Kazakhstan culture","meta":["1937 deportation","Korean-Central Asian cuisine"],"summary":"Soviet Koreans were forcibly deported from the Far East to Kazakhstan and Uzbekistan in 1937, and their descendants developed a distinctive Koryo-saram culture in Central Asia.","notice":["The community’s presence is tied directly to Stalinist forced resettlement.","Koryo-saram cuisine adapted to Soviet Central Asian ingredients and markets.","Korean salads became so ordinary in Kazakhstan that many people encounter this history first through food."],"story":"A carrot salad in an Almaty market can open a serious historical story: migration, repression and adaptation became part of ordinary national cuisine.","myth":"Koryo-saram cuisine developed in the Soviet and Central Asian environment and is distinct from contemporary South Korean food culture.","deep":"The wider Soviet deportation system also brought Germans, Chechens, Ingush, Poles, Greeks and other communities to Kazakhstan, shaping the country’s present ethnic diversity.","tags":["koryo-saram","korean","deportation","salad","food","ethnic diversity"],"image":"images/koryo-saram.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Corean_carrot_salad.jpg/960px-Corean_carrot_salad.jpg","photoKey":"koryo"},{"id":"collectivisation-famine","section":"kazakhstan","category":"Soviet history","icon":"🌾","title":"Collectivisation & the Famine","subtitle":"One of the most important twentieth-century transformations of Kazakh society","meta":["late 1920s–1930s","forced sedentarisation"],"summary":"Stalinist collectivisation, livestock requisition and the forced restructuring of pastoral life produced a catastrophic famine and mass flight from Kazakhstan.","notice":["The catastrophe was created by Soviet policy, not simply by bad weather.","Pastoral livelihoods were radically disrupted by requisition and forced social engineering.","The legal-historical label 'genocide' remains debated among historians."],"story":"The scale of change is hard to understand without remembering that livestock was not merely food: it was transport, capital, social security and the operating system of pastoral life.","myth":"Soviet policy caused the catastrophe and Kazakh losses were extraordinary. The continuing historical debate concerns whether the events meet the specific legal-historical definition of genocide.","deep":"The famine also drove large-scale flight into neighbouring Soviet republics and China and permanently altered demographics, settlement and memory.","tags":["famine","collectivisation","sedentarisation","stalin","soviet","history"],"image":"images/collectivisation-famine.webp","alsoExplore":false},{"id":"soviet-everyday","section":"kazakhstan","category":"Soviet heritage","icon":"🏢","title":"Soviet Everyday Life","subtitle":"Apartments, schools, sports clubs and the USSR people remember personally","meta":["mass schooling","microdistricts • sport • tourism"],"summary":"Soviet Kazakhstan is often easiest to understand through ordinary institutions: schools, apartment districts, public transport, sports clubs, sanatoria and organised tourism.","notice":["Mass schooling and technical education reshaped social mobility.","Apartment microdistricts, public transport and Palaces of Culture structured urban life.","Sports schools, sanatoria, Pioneer camps, mountaineering clubs and organised tourism created shared Soviet routines."],"story":"Medeu and mountain clubs belong to the same Soviet everyday world as apartment blocks, cafeterias and technical schools: leisure, education and social life were built through institutions.","myth":"Positive memories of Soviet education, work or childhood can coexist with strong criticism of repression, shortages, Russification or political violence.","deep":"The paradox matters: the Soviet project disrupted older Kazakh social worlds while also building much of the urban, scientific, educational and infrastructural Kazakhstan visible today.","tags":["soviet","everyday life","apartments","schools","sport","mountaineering","sanatorium"],"image":"images/soviet-everyday.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/%D0%97%D0%B4%D0%B0%D0%BD%D0%B8%D0%B5_%D0%A1%D0%BE%D0%B2%D0%BD%D0%B0%D1%80%D0%BA%D0%BE%D0%BC%D0%B0_%D0%9A%D0%B0%D0%B7%D0%90%D0%A1%D0%A1%D0%A0_(%D0%90%D0%BB%D0%BC%D0%B0-%D0%90%D1%82%D0%B0)-3.jpg/960px-%D0%97%D0%B4%D0%B0%D0%BD%D0%B8%D0%B5_%D0%A1%D0%BE%D0%B2%D0%BD%D0%B0%D1%80%D0%BA%D0%BE%D0%BC%D0%B0_%D0%9A%D0%B0%D0%B7%D0%90%D0%A1%D0%A1%D0%A0_(%D0%90%D0%BB%D0%BC%D0%B0-%D0%90%D1%82%D0%B0)-3.jpg","photoKey":"soviet"},{"id":"baikonur","section":"kazakhstan","category":"Soviet heritage","icon":"🚀","title":"Baikonur","subtitle":"A world-famous spaceport inside Kazakhstan’s post-Soviet story","meta":["Gagarin 1961","space programme"],"summary":"Baikonur linked Kazakhstan physically and symbolically to the Soviet space programme, including Yuri Gagarin’s 1961 launch.","notice":["It became one of humanity’s most famous launch sites.","Its history belongs simultaneously to Soviet science and contemporary Kazakhstan.","The site is a strong example of post-Soviet institutional entanglement."],"story":"Ancient pastoral landscapes and one of the world’s most famous spaceports belong to the same country. Kazakhstan’s history is broad enough to contain both.","myth":"Baikonur is part of Kazakhstan’s territory and history, but the space programme that made it famous was a Soviet project and remains institutionally connected to Russia.","deep":"Baikonur changes the scale of the story: Kazakhstan is connected not only to steppe and pastoral history but also to rockets, engineering and Cold War science.","tags":["baikonur","space","gagarin","soviet","science","rocket"],"image":"images/baikonur.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Soyuz_TMA-21_launches_from_the_Baikonur_Cosmodrome.jpg/960px-Soyuz_TMA-21_launches_from_the_Baikonur_Cosmodrome.jpg","photoKey":"baikonur"},{"id":"semipalatinsk","section":"kazakhstan","category":"Soviet heritage","icon":"☢️","title":"Semipalatinsk Nuclear Test Site","subtitle":"Nuclear testing, environmental harm and anti-nuclear memory","meta":["Semey region","Nevada–Semipalatinsk movement"],"summary":"The Soviet nuclear test programme exposed the Semipalatinsk/Semey region to major radioactive contamination and long-term health and environmental harm.","notice":["The test site became one of the darkest environmental legacies of Soviet Kazakhstan.","Nevada–Semipalatinsk became an important late-Soviet anti-nuclear movement.","Anti-nuclear memory later became part of independent Kazakhstan’s international identity."],"story":"The story is not only about weapons testing; it is also about how a local environmental and health catastrophe helped produce a major civic anti-nuclear movement.","myth":"The nuclear test site was not an empty remote zone: communities were exposed to radiation and its long-term health and environmental effects.","deep":"The most important themes are human exposure, environmental damage, long-term health consequences and the later anti-nuclear movement.","tags":["semipalatinsk","semey","nuclear","soviet","nevada semipalatinsk","environment"],"image":"images/semipalatinsk.webp","alsoExplore":false},{"id":"holidays","section":"kazakhstan","category":"Culture","icon":"📅","title":"Holidays as a Map of History","subtitle":"Kazakhstan did not replace one calendar — it accumulated layers","meta":["Nauryz • 9 May • 8 March","Republic & Independence days"],"summary":"Kazakhstan’s public calendar contains Soviet inheritances, independent-state holidays, religious celebrations and post-Soviet hybrid commemorations.","notice":["8 March, New Year and Victory Day retain major Soviet or late-Soviet social histories.","Republic Day and Independence Day express the independent state.","Orthodox Christmas, Oraza Ait and Qurban Ait add religious layers."],"story":"A calendar can work like archaeology: instead of one era replacing another, different historical layers remain visible every year.","myth":"Kazakhstan’s calendar did not simply replace Soviet holidays after independence; Soviet, national, religious and newer state traditions now sit alongside one another.","deep":"Unity Day, Defender of the Fatherland Day, Constitution Day and shifting official calendars show that public commemoration continues to evolve.","tags":["holidays","calendar","victory day","independence day","republic day","nauryz"],"image":"images/holidays.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Traditional_costume_for_Nowruz.JPG/960px-Traditional_costume_for_Nowruz.JPG","photoKey":"nauryz"}];
const journeyDays = [{"day":"Day 1","title":"Almaty orientation","text":"Almaty’s history, architecture and mountain setting before the journey begins.","ids":["almaty","central-museum","panfilov-cathedral"]},{"day":"Day 2","title":"Butakovka → Medeu → Shymbulak","text":"A long traverse linking Butakovka, the watershed and Kimasar before descending to Medeu and Shymbulak.","ids":["butakovka","butakovsky-pass","enthusiasts-meadow","kimasar","butakovka-traverse","medeu","shymbulak"]},{"day":"Day 3","title":"Mynzhylky high-alpine day","text":"A high-alpine day above Shymbulak in the classic Tuyuksu mountain corridor.","ids":["mynzhylky"]},{"day":"Day 4","title":"Chimbulachka Peak","text":"A lift-assisted high summit day from the Talgar Pass side.","ids":["chimbulachka","talgar-pass"]},{"day":"Day 5","title":"Issyk → Ethno Aul → Turgen → Assy","text":"From Saka archaeology and Kazakh heritage into the forests of Turgen and the high Assy Plateau.","ids":["golden-man","ethno-aul","turgen","assy"]},{"day":"Day 6","title":"Assy → Kara Arsha → Sary Tau → Zhenishke","text":"Open pasture, high ridges and the descent toward the Zhenishke Valley.","ids":["assy-pass","kara-arsha","sary-tau","zhenishke"]},{"day":"Day 7","title":"Zhenishke Valley","text":"A quieter day following the Zhenishke river landscape.","ids":["zhenishke"]},{"day":"Day 8","title":"Kaindy → Saty","text":"The earthquake-created forest lake of Kaindy and the village of Saty.","ids":["kolsai-park","kaindy","saty"]},{"day":"Day 9","title":"Kolsai Lakes","text":"A walk through the Kolsai lake system from the busy lower lake toward higher forested terrain.","ids":["lower-kolsai","middle-kolsai","upper-kolsai"]},{"day":"Day 10","title":"Charyn → Zharkent → Ili → Basshi","text":"Canyon geology, Zharkent’s borderland architecture and the Ili River on the road to Altyn-Emel.","ids":["charyn","zharkent-city","zharkent-mosque","ili","basshi"]},{"day":"Day 11","title":"Altyn-Emel","text":"Altyn-Emel’s colourful geology, d let view='journey', activeFilter='All', qIndex=0, score=0, answered=false;

const content=document.getElementById('content');
const nav=document.getElementById('nav');
const sheet=document.getElementById('sheet');
const backdrop=document.getElementById('backdrop');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function getItem(id){return items.find(x=>x.id===id);}
function imageHero(x, cls='hero'){
  const src=x.remoteImage || x.image || '';
  return `<div class="${cls}">
    <div class="fallback"></div>
    ${src?`<img src="${esc(src)}" loading="${cls==='sheet-hero'?'eager':'lazy'}" decoding="async" alt="${esc(x.title)}" onerror="this.style.display='none'">`:''}
    ${cls==='hero'?`<span class="badge">${esc(x.category)}</span>`:''}
  </div>`;
}
function card(x){
  return `<article class="card" onclick="openItem('${x.id}')">
    ${imageHero(x)}
    <div class="card-body">
      <h3>${esc(x.title)}</h3>
      <div class="subtitle">${esc(x.subtitle)}</div>
      <div class="meta">${x.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>
      <p class="summary">${esc(x.summary)}</p>
    </div>
  </article>`;
}
function miniCard(x){
  return `<div class="mini" onclick="openItem('${x.id}')">
    <strong>${esc(x.title)}</strong>
    <span>${esc(x.subtitle)}</span>
  </div>`;
}
function filtersFor(arr){
  const cats=['All',...new Set(arr.map(x=>x.category))];
  return `<div class="filters">${cats.map(c=>`<button class="${c===activeFilter?'active':''}" onclick="setFilter('${esc(c).replace(/'/g,"\'")}')">${esc(c)}</button>`).join('')}</div>`;
}
function render(){
  [...nav.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  if(view==='journey') renderJourney();
  else if(view==='explore') renderCollection('explore','Explore the places','Visited places, original route alternatives and connected stops.');
  else if(view==='kazakhstan') renderCollection('kazakhstan','Understand Kazakhstan','Culture, history and modern life in short layers.');
  else if(view==='stories') renderStories();
  else if(view==='quiz') renderQuiz();
  else if(view==='search') renderSearch();
}
function renderJourney(){
  activeFilter='All';
  content.innerHTML=`<div class="section-head"><div><h2>The journey</h2><p>Follow the trip in order and open any stop for a deeper explanation.</p></div></div>`+
  journeyDays.map(d=>`<section class="day">
    <div class="day-label">${esc(d.day)}</div>
    <h2>${esc(d.title)}</h2><p>${esc(d.text)}</p>
    <div class="route-strip">${d.ids.map(id=>getItem(id)).filter(Boolean).map(miniCard).join('')}</div>
  </section>`).join('');
}
function renderCollection(section,title,sub){
  const arr=items.filter(x=>x.section===section || (section==='explore' && x.alsoExplore));
  if(activeFilter!=='All' && !arr.some(x=>x.category===activeFilter)) activeFilter='All';
  const shown=activeFilter==='All'?arr:arr.filter(x=>x.category===activeFilter);
  content.innerHTML=`<div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div></div>${filtersFor(arr)}<div class="count">${shown.length} topics</div><div class="grid">${shown.map(card).join('')}</div>`;
}
function setFilter(c){activeFilter=c;render();}
function renderStories(){
  const arr=featuredStories.map(getItem).filter(Boolean);
  content.innerHTML=`<div class="section-head"><div><h2>Story bank</h2><p>Short ideas designed to be remembered and retold.</p></div></div>
  <button class="surprise" onclick="surpriseMe()">Surprise me</button>
  <div class="story-list">${arr.map(x=>`<div class="story" onclick="openItem('${x.id}')"><strong>${esc(x.title)}</strong><span>${esc(x.story)}</span></div>`).join('')}</div>`;
}
function renderSearch(){
  activeFilter='All';
  content.innerHTML=`<div class="section-head"><div><h2>Search everything</h2><p>Try a place, food, Soviet history, religion, glacier, horse, language…</p></div></div>
  <div class="toolbar"><input id="searchBox" class="search" placeholder="Search Kazakhstan…"></div>
  <div id="searchCount" class="count">${items.length} topics</div><div id="searchResults" class="grid">${items.map(card).join('')}</div>`;
  document.getElementById('searchBox').addEventListener('input',e=>search(e.target.value));
  setTimeout(()=>document.getElementById('searchBox').focus(),80);
}
function search(term){
  const t=term.trim().toLowerCase();
  const arr=!t?items:items.filter(x=>[x.title,x.subtitle,x.summary,x.category,...x.tags,...x.notice,x.story,x.myth,x.deep,...x.meta].join(' ').toLowerCase().includes(t));
  document.getElementById('searchCount').textContent=`${arr.length} topic${arr.length===1?'':'s'}`;
  document.getElementById('searchResults').innerHTML=arr.length?arr.map(card).join(''):`<div class="empty">Nothing found yet.</div>`;
}
function openItem(id){
  const x=getItem(id); if(!x)return;
  document.getElementById('sheetContent').innerHTML=`
    ${imageHero(x,'sheet-hero')}
    <div class="small">${esc(x.category)}</div>
    <h2>${esc(x.title)}</h2>
    <div class="subtitle">${esc(x.subtitle)}</div>
    <div class="meta">${x.meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>
    <p>${esc(x.summary)}</p>
    <h4>Look closer</h4>
    <ul>${x.notice.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
    <div class="callout"><strong>Why it matters</strong><br>${esc(x.story)}</div>
    <div class="callout myth"><strong>A useful distinction</strong><br>${esc(x.myth)}</div>
    <h4>More context</h4>
    <p>${esc(x.deep)}</p>`;
  sheet.classList.add('open'); backdrop.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');}
backdrop.addEventListener('click',closeSheet);
nav.addEventListener('click',e=>{
  const b=e.target.closest('button[data-view]'); if(!b)return;
  view=b.dataset.view; activeFilter='All'; render(); window.scrollTo({top:0,behavior:'smooth'});
});
function surpriseMe(){
  const pool=featuredStories.map(getItem).filter(Boolean);
  if(!pool.length)return;
  openItem(pool[Math.floor(Math.random()*pool.length)].id);
}
function renderQuiz(){
  const q=quiz[qIndex];
  if(!q){
    content.innerHTML=`<div class="quiz-card"><h2>Quiz complete</h2><p>You scored <strong>${score} / ${quiz.length}</strong>.</p><button class="choice" onclick="restartQuiz()">Try again</button></div>`;
    return;
  }
  const pct=Math.round((qIndex/quiz.length)*100);
  content.innerHTML=`<div class="quiz-card">
    <div class="small">Question ${qIndex+1} of ${quiz.length}</div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <h2>${esc(q.q)}</h2>
    <div id="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="answerQuiz(${i},this)">${esc(c)}</button>`).join('')}</div>
    <div id="quizFoot"></div>
  </div>`; answered=false;
}
function answerQuiz(i,btn){
  if(answered)return; answered=true; const q=quiz[qIndex];
  const buttons=[...document.querySelectorAll('#choices .choice')];
  buttons[q.a].classList.add('correct');
  if(i===q.a)score++; else btn.classList.add('wrong');
  document.getElementById('quizFoot').innerHTML=`<div class="score">${i===q.a?'Correct':'Not quite'}</div><button class="choice" onclick="nextQuiz()">Next</button>`;
}
function nextQuiz(){qIndex++;renderQuiz();}
function restartQuiz(){qIndex=0;score=0;renderQuiz();}

function openCredits(){
  const used=[...new Set(items.map(x=>x.photoKey).filter(Boolean))];
  const list=used.map(k=>photoAssets[k]).filter(Boolean).sort((a,b)=>a.filename.localeCompare(b.filename));
  document.getElementById('creditsList').innerHTML=list.map(a=>`
    <div class="credit-row">
      <a href="${esc(a.page)}" target="_blank" rel="noopener">${esc(a.filename)}</a><br>
      ${esc(a.author)} · ${esc(a.license)}
    </div>`).join('');
  document.getElementById('creditsSheet').classList.add('open');
  document.getElementById('creditsBackdrop').classList.add('open');
}
function closeCredits(){
  document.getElementById('creditsSheet').classList.remove('open');
  document.getElementById('creditsBackdrop').classList.remove('open');
}

render();
</script>

<footer class="site-footer"><button class="credits-link" onclick="openCredits()">Image credits</button></footer>
<div class="credits-backdrop" id="creditsBackdrop" onclick="closeCredits()"></div>
<section class="credits-sheet" id="creditsSheet">
  <div class="handle"></div><button class="close-btn" onclick="closeCredits()">×</button>
  <h2>Image credits</h2>
  <p class="small">Photography is sourced from Wikimedia Commons and shown under the licence listed for each file.</p>
  <div id="creditsList"></div>
</section>

</body>
</html>
