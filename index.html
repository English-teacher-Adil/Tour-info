<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#163f34">
<title>Kazakhstan Field Guide</title>
<style>
:root {
  --bg:#f3f1eb; --card:#fff; --ink:#171716; --muted:#6c6a64;
  --line:#dedad0; --green:#17483b; --green2:#245f50; --gold:#b98d3f;
  --soft:#e7eee9; --warn:#f4e6dc; --chip:#ece9e1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit}
header{padding:30px 18px 18px;background:linear-gradient(150deg,#11392f,#22584a 65%,#5f6e47);color:#fff}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
h1{font-size:31px;line-height:1.03;margin:8px 0 10px;letter-spacing:-.035em}
header p{margin:0;max-width:620px;opacity:.86;line-height:1.45;font-size:14px}
.header-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.header-stats span{font-size:11px;background:rgba(255,255,255,.13);padding:7px 9px;border-radius:999px}
nav{position:sticky;top:0;z-index:20;background:rgba(243,241,235,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:8px;gap:5px}
nav button{border:0;background:transparent;border-radius:999px;padding:10px 12px;white-space:nowrap;font-weight:750;color:#4b4944}
nav button.active{background:var(--ink);color:#fff}
main{max-width:1040px;margin:0 auto;padding:16px 14px 90px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 2px 15px}
.section-head h2{font-size:24px;margin:0;letter-spacing:-.02em}
.section-head p{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.filters{display:flex;gap:6px;overflow:auto;margin:0 0 14px;padding-bottom:2px}
.filters button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:999px;white-space:nowrap;font-size:12px;font-weight:700;color:#55524d}
.filters button.active{background:var(--green);border-color:var(--green);color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 3px 15px rgba(0,0,0,.035);cursor:pointer;transition:transform .12s ease}
.card:active{transform:scale(.99)}
.hero{height:154px;background:linear-gradient(135deg,#d8dfd8,#e7dfcf);position:relative;overflow:hidden}
.hero img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.hero .fallback{position:absolute;inset:0;background:linear-gradient(135deg,#d8dfd8,#e8deca)}
.badge{position:absolute;z-index:3;top:10px;left:10px;background:rgba(255,255,255,.91);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;color:#333}
.card-body{padding:15px}
.card h3{font-size:19px;margin:0 0 4px;letter-spacing:-.015em}
.subtitle{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.35}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.meta span{font-size:10.5px;background:#f1efe9;padding:5px 7px;border-radius:999px}
.summary{font-size:13.5px;line-height:1.5;margin:0}
.day{margin:0 0 24px}
.day-label{font-size:11px;font-weight:850;color:var(--green);text-transform:uppercase;letter-spacing:.1em}
.day h2{font-size:22px;margin:4px 0 3px}
.day > p{font-size:13px;color:var(--muted);margin:0 0 10px}
.route-strip{display:flex;gap:10px;overflow:auto;padding:2px 1px 6px}
.mini{min-width:205px;max-width:205px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.mini .mini-icon{display:none}
.mini strong{display:block;margin:7px 0 4px;font-size:14px}
.mini span{font-size:11.5px;line-height:1.4;color:var(--muted)}
.toolbar{display:flex;gap:8px;margin:2px 0 16px;align-items:center}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.search:focus{border-color:#9aa99f}
.count{font-size:12px;color:var(--muted);margin:0 0 12px}
.empty{padding:35px 10px;text-align:center;color:var(--muted)}
.story-list{display:grid;gap:10px}
.story{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;cursor:pointer}
.story strong{display:block;margin-bottom:5px;font-size:15px}
.story span{font-size:13.5px;line-height:1.5}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:49;display:none}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:25px 25px 0 0;padding:10px 16px 34px;transform:translateY(110%);transition:.24s ease}
.sheet.open{transform:translateY(0)}
.sheet-backdrop.open{display:block}
.handle{width:44px;height:5px;border-radius:9px;background:#c8c4ba;margin:2px auto 14px}
.sheet-hero{height:210px;border-radius:18px;background:linear-gradient(135deg,#dce7df,#eee0c4);margin-bottom:14px;overflow:hidden;position:relative}
.sheet-hero img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.sheet-hero .fallback{position:absolute;inset:0;background:linear-gradient(135deg,#d8dfd8,#e8deca)}
.sheet h2{font-size:28px;margin:0 0 4px;letter-spacing:-.025em}
.sheet h4{font-size:13px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.07em;color:#504e49}
.sheet p,.sheet li{font-size:14.5px;line-height:1.56}
.sheet ul{padding-left:20px}
.callout{background:var(--soft);border-radius:15px;padding:12px 13px;margin:12px 0}
.myth{background:var(--warn)}
.close-btn{position:sticky;top:0;float:right;border:0;background:rgba(255,255,255,.9);width:34px;height:34px;border-radius:50%;font-size:18px;z-index:4}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;max-width:700px;margin:auto}
.quiz-card h2{font-size:22px;margin:6px 0 14px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin:8px 0;font-size:14px}
.choice.correct{border-color:#376c5b;background:#e4eee8}
.choice.wrong{border-color:#9b5b4f;background:#f3e4e1}
.score{font-weight:800;margin-top:14px}
.small{font-size:11.5px;color:var(--muted);line-height:1.45}.photo-credit{font-size:10.5px;color:var(--muted);margin:-6px 2px 12px}.photo-credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}.surprise{border:0;background:var(--green);color:#fff;border-radius:999px;padding:10px 13px;font-weight:800;font-size:12px;margin-bottom:14px}
.progress{height:6px;background:#ece9e1;border-radius:99px;overflow:hidden;margin:8px 0 18px}
.progress > div{height:100%;background:var(--green);transition:.2s}
.site-footer{max-width:1040px;margin:-55px auto 30px;padding:0 14px;text-align:center}
.credits-link{border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:11px;padding:8px}
.credits-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:59;display:none}
.credits-backdrop.open{display:block}
.credits-sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--bg);border-radius:25px 25px 0 0;padding:14px 18px 34px;transform:translateY(110%);transition:.24s ease}
.credits-sheet.open{transform:translateY(0)}
.credit-row{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.45}
.credit-row a{color:var(--green);font-weight:700;text-decoration:none}
@media(min-width:760px){
  header{padding:40px 28px 28px} h1{font-size:43px}
  .sheet{left:50%;right:auto;width:700px;transform:translate(-50%,110%)} .credits-sheet{left:50%;right:auto;width:700px;transform:translate(-50%,110%)}
  .sheet.open{transform:translate(-50%,0)} .credits-sheet.open{transform:translate(-50%,0)}
}
</style>
</head>

const items = [{"id":"almaty","section":"explore","category":"City","icon":"🏙️","title":"Almaty","subtitle":"A city built directly against the mountains","meta":["~700–950 m","Trans-Ili Alatau foothills"],"summary":"Almaty sits on large alluvial and debris-flow fans where mountain streams leave the Trans-Ili Alatau and spread into the Ili Basin.","notice":["The mountains are close enough that city streets, spruce forest and alpine terrain can be experienced in one day.","The modern city grew from imperial Verny, but the wider area has a much older settlement history.","Wild Malus sieversii forests nearby are part of the complex ancestry of the domestic apple."],"story":"Almaty works best as a landscape story: tectonic uplift built the relief, rivers carried debris onto the mountain front, and the city grew on those fans.","myth":"Almaty is much older than the imperial fort of 1854, and its apple story is more complex than the slogan that every apple in the world came from this city.","deep":"Earthquakes, debris flows, mountain hydrology, Soviet-era urban development and a strong weekend-mountain culture all meet here.","tags":["almaty","vern y","apple","earthquake","city","mountains","soviet","modern"],"image":"images/almaty.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty_Skyline.jpg/960px-Almaty_Skyline.jpg","photoKey":"almaty"},{"id":"central-museum","section":"explore","category":"Museum","icon":"🏛️","title":"Central State Museum","subtitle":"A fast orientation to Kazakhstan before the road trip","meta":["central Almaty","archaeology • ethnography • history"],"summary":"The museum helps place Zhetysu landscapes inside longer archaeological, ethnographic and national histories.","notice":["Its collections grew through Soviet-era scholarly institutions.","It is useful for separating Iron Age archaeology, later Kazakh ethnography and modern national symbolism.","Exhibitions are curated interpretations rather than a window onto one timeless culture."],"story":"This is a useful place to build the timeline for the rest of the journey: Saka archaeology, Kazakh material culture, Soviet institutions and modern national symbolism begin to separate into distinct layers.","myth":"Exhibitions change, so the museum is best approached as a broad introduction to Kazakhstan rather than a promise of one particular object or gallery.","deep":"The museum is most useful as a framework: landscape, archaeology, ethnography and modern identity are different layers that later reappear on the trip.","tags":["museum","almaty","archaeology","ethnography","history","golden man"],"image":"images/central-museum.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Golden_Man,_Almaty_Central_State_Museum_of_Kazakhstan.jpg/960px-Golden_Man,_Almaty_Central_State_Museum_of_Kazakhstan.jpg","photoKey":"golden"},{"id":"panfilov-cathedral","section":"explore","category":"City & memory","icon":"⛪","title":"Panfilov Park & Ascension Cathedral","subtitle":"Imperial architecture, Soviet memory and modern Almaty in one place","meta":["old central Almaty","~800 m"],"summary":"The park and cathedral layer imperial Verny, Orthodox heritage, Soviet war memory and contemporary Kazakhstan in the same urban space.","notice":["The timber cathedral survived the destructive 1911 Kemin earthquake remarkably well.","Panfilov’s division genuinely fought in the defence of Moscow.","The famous story of exactly 28 Guardsmen has a contested documentary history."],"story":"This is a rare stop where one square can lead naturally from earthquakes to imperial architecture, Soviet remembrance and present-day religious life.","myth":"The Panfilov Division’s role in the defence of Moscow was real, while the famous story of exactly 28 men was shaped into a much more precise heroic legend during the war.","deep":"The cathedral is an active religious site, while the surrounding memorial landscape remains emotionally important to many people and residents.","tags":["panfilov","cathedral","wwii","soviet","orthodox","earthquake","almaty"],"image":"images/panfilov-cathedral.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Ascension_Cathedral,_Almaty.jpg/960px-Ascension_Cathedral,_Almaty.jpg","photoKey":"cathedral"},{"id":"kok-zhailau","section":"explore","category":"Original itinerary","icon":"🌿","title":"Kok Zhailau & Green Pass","subtitle":"Almaty’s famous high meadow and recreation landscape","meta":["~2,200–2,500 m","original route"],"summary":"Kok Zhailau is a broad high meadow and recreation landscape on the ridges above Almaty, historically linked by hiking routes toward Medeu and neighbouring valleys.","notice":["Kök can mean green/blue and zhailau means summer pasture.","Schrenk spruce occupies cooler slopes while open subalpine meadow dominates higher ground.","The area became a major environmental and development controversy."],"story":"The word zhailau opens a useful discussion of seasonal pastoralism, while the modern landscape also tells a story about city recreation and conservation pressure.","myth":"Kok Zhailau is neither untouched wilderness nor a frozen piece of nomadic life. It is also a modern recreation landscape with a long-running development debate.","deep":"Kok Zhailau connects pastoral vocabulary, Soviet/post-Soviet hiking culture, erosion pressure and modern debates over mountain tourism development.","tags":["kok zhailau","green pass","zhailau","meadow","original route","conservation"],"image":"images/kok-zhailau.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Kok_zhailau.jpg/960px-Kok_zhailau.jpg","photoKey":"kokzhailau"},{"id":"medeu","section":"explore","category":"Mountain gateway","icon":"⛸️","title":"Medeu","subtitle":"Ice records, mudflow engineering and the gateway uphill","meta":["rink 1,691 m","opened 1972"],"summary":"Medeu occupies the narrow Malaya Almatinka valley above Almaty; road and gondola continue to Shymbulak while the debris-flow protection system guards the corridor below.","notice":["The present artificial-ice rink opened in 1972 after earlier natural-ice use.","Record totals differ by counting period and category.","The dam and rink make engineering as important to the story as altitude."],"story":"For Almaty residents Medeu is not just a sports venue: it is school trips, dates, weekend walks and the threshold of the high mountains.","myth":"Altitude helped make Medeu unusual, but the famous skating records also depended on ice engineering, weather, training and the quality of the rink.","deep":"Official material describes a large refrigerated ice surface and a major pipe network, while the adjacent dam is an answer to debris-flow risk in a steep seismic valley.","tags":["medeu","medeo","skating","soviet sport","mudflow","engineering","almaty"],"image":"images/medeu.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Almaty,_Medeu.jpg/960px-Almaty,_Medeu.jpg","photoKey":"medeu"},{"id":"shymbulak","section":"explore","category":"Mountain resort","icon":"🚡","title":"Shymbulak","subtitle":"The developed alpine node above Medeu","meta":["base ~2,260 m","Talgar Pass lift ~3,200 m"],"summary":"Shymbulak links the city directly to high alpine terrain and serves as the launch point for Talgar Pass, Chimbulachka and approaches toward Tuyuksu and Bogdanovich.","notice":["Formal ski-sport history is traced to the 1950s.","It became an Olympic training centre in the Soviet period.","Avalanche control, snowmaking and slope engineering are part of daily resort operation."],"story":"Shymbulak is a symbol of Almaty’s mountain lifestyle: Soviet competitive skiing, modern resort culture and ordinary weekend recreation overlap here.","myth":"Shymbulak is a high mountain resort, but it is not the world’s highest ski resort.","deep":"The resort occupies a glacially and fluvially shaped valley below steep Tien Shan ridges. Lift operation, maintenance, snow and wind can change access quickly.","tags":["shymbulak","chimbulak","ski","talgar pass","soviet sport","almaty"],"image":"images/shymbulak.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Shymbulak,_Almaty_(P1180202).jpg/960px-Shymbulak,_Almaty_(P1180202).jpg","photoKey":"shymbulak"},{"id":"mynzhylky","section":"explore","category":"High alpine","icon":"️","title":"Mynzhylky Plateau","subtitle":"“A thousand horses” above Shymbulak","meta":["~3,000–3,100 m","Upper Malaya Almatinka"],"summary":"Mynzhylky is the high staging level between Shymbulak resort infrastructure and the Tuyuksu glacial basin.","notice":["The name means roughly 'a thousand horses.'","Morainic and alluvial deposits fill a broad high valley below glaciated cirques.","Soviet hydrometeorological, glaciological and mountaineering infrastructure made it a research and training base."],"story":"A pastoral place-name survives in a landscape now strongly associated with science, acclimatisation and climbing.","myth":"There are two different places called Mynzhylky on this journey: this high plateau above Shymbulak and a lake in the Kolsai system.","deep":"Weather, hydrology and long-term glacier monitoring are key themes. Alpine meadow quickly grades into sparse nival vegetation with strong wind and UV.","tags":["mynzhylky","thousand horses","shymbulak","tuyuksu","glacier","science"],"image":"images/mynzhylky.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/The_Tuyuksu_Glacier.jpg/960px-The_Tuyuksu_Glacier.jpg","photoKey":"tuyuksu"},{"id":"tuyuksu","section":"explore","category":"Original itinerary","icon":"🧊","title":"Tuyuksu Glacier","subtitle":"A glacier that is also a measuring instrument","meta":["tongue/route ~3,400–3,500 m","original route"],"summary":"Central Tuyuksu occupies a compact glacial basin above Almaty and is one of Central Asia’s most valuable long-running glacier-monitoring sites.","notice":["Soviet glaciologists established systematic observations here.","A 2024 Kazhydromet study reported about 420 m retreat in 2006–2023 and about 1,190 m since 1958.","For Almaty climbers it is both a scientific landscape and a formative mountaineering school."],"story":"Tuyuksu is interesting because the same glacier can be read as scenery, a climbing environment and a decades-long climate record.","myth":"Predictions about exactly when Tuyuksu might disappear vary. What is clear is that the glacier has retreated strongly and continues to change.","deep":"Moraines preserve former ice positions. Retreat changes the snout and approach terrain, so old route descriptions are not safety guarantees.","tags":["tuyuksu","tuyuk su","glacier","climate","glaciology","mountaineering","original route"],"image":"images/tuyuksu.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/The_Tuyuksu_Glacier.jpg/960px-The_Tuyuksu_Glacier.jpg","photoKey":"tuyuksu"},{"id":"mountain-memorial","section":"explore","category":"Mountaineering","icon":"🔔","title":"Memorial to Those Who Died in the Mountains","subtitle":"Remembrance on the road to the high peaks","meta":["Tuyuksu approach","mountaineering culture"],"summary":"The memorial lies on the classic approach into the Tuyuksu training basin, placing remembrance directly on the route to the high mountains.","notice":["It commemorates people lost in the mountains.","It is part of the social culture of Almaty mountaineering.","Passing the memorial can open a respectful discussion of risk, rescue and community memory."],"story":"Climbers literally pass memory on their way upward: the location itself makes the point that mountain culture includes loss as well as achievement.","myth":"The memorial is best understood as a place of collective mountain memory; individual stories attached to names on the plaques require their own verification.","deep":"Generations of Almaty climbers trained in the Tuyuksu basin, and the memorial became part of that shared culture of risk, loss and remembrance.","tags":["memorial","mountaineering","tuyuksu","climbers","risk","almaty"],"image":"images/mountain-memorial.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/The_Tuyuksu_Glacier.jpg/960px-The_Tuyuksu_Glacier.jpg","photoKey":"tuyuksu"},{"id":"talgar-pass","section":"explore","category":"High alpine","icon":"🪨","title":"Talgar Pass","subtitle":"A lift-accessible saddle above 3,000 metres","meta":["~3,200 m","upper Shymbulak"],"summary":"The upper Shymbulak lift reaches this high saddle, opening views toward the Left Talgar side, glaciated basins and surrounding ridges.","notice":["It is one of the easiest places near Almaty to reach terrain above 3,000 m without a technical ascent.","Its best-documented modern importance is ski and mountaineering access.","Altitude, wind and rapid weather change are obvious here."],"story":"Talgar Pass makes altitude visible: treeline is gone, vegetation thins, wind exposure rises and glaciated terrain suddenly feels close.","myth":"Talgar Pass is important today for mountain access and views. A specific Silk Road role is not established by the material behind this site.","deep":"The saddle is useful for explaining frost weathering, snow distribution, nival terrain and the way modern lifts change access to high mountains.","tags":["talgar pass","shymbulak","high alpine","ski","mountaineering"],"image":"images/talgar-pass.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Shymbulak,_Almaty_(P1180202).jpg/960px-Shymbulak,_Almaty_(P1180202).jpg","photoKey":"shymbulak"},{"id":"bogdanovich","section":"explore","category":"Original itinerary","icon":"🧊","title":"Bogdanovich Glacier","subtitle":"High glacial terrain beyond Talgar Pass","meta":["Talgar Pass side","original route"],"summary":"Bogdanovich lies beyond the upper Shymbulak terrain beneath steep high ridges and is approached or viewed from the Talgar Pass side.","notice":["It belongs to the lift-accessible high-alpine landscape above Shymbulak.","The surrounding terrain is shaped by glaciation and frost weathering.","Cable-car access shortens the approach but does not remove alpine hazards."],"story":"The striking contrast here is accessibility: serious glaciated terrain lies unusually close to a major city and a modern lift system.","myth":"The exact person behind the glacier’s name is inconsistently described in secondary sources. Easy lift access also does not make glacier terrain easy or safe.","deep":"The glacier is a good place to see the difference between convenient access and easy terrain: lifts shorten the approach, while rock, ice, weather and altitude remain alpine.","tags":["bogdanovich","glacier","talgar pass","shymbulak","original route"],"image":"images/bogdanovich.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/The_Tuyuksu_Glacier.jpg/960px-The_Tuyuksu_Glacier.jpg","photoKey":"tuyuksu"},{"id":"butakovka","section":"explore","category":"Mountain route","icon":"💧","title":"Butakovka & Upper Waterfall","subtitle":"A green valley climbing toward the watershed","meta":["lower valley ~1,700 m","upper waterfall ~2,450–2,550 m"],"summary":"Butakovka rises from Almaty’s eastern mountain edge toward a high watershed that can be crossed on foot into the Kimasar–Medeu system.","notice":["Lower riparian and deciduous vegetation gives way to Schrenk spruce and then subalpine meadow.","Waterfall flow is seasonal and responds to snowmelt and storms.","The gorge has long been part of Almaty’s weekend hiking geography."],"story":"The route is a compact lesson in how quickly landscape changes as you climb away from the city: stream valley, spruce forest, waterfall and high meadow appear in sequence.","myth":"Local maps use several names and numbers for the Butakovka waterfalls, so 'Upper', 'Second' and similar labels are not perfectly standardised.","deep":"The gorge also sits inside contemporary mountain-tourism planning, so work zones, fire restrictions and access can change.","tags":["butakovka","waterfall","2026 route","spruce","hiking","almaty"],"image":"images/butakovka.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/%D0%91%D1%83%D1%82%D0%B0%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4_19.jpg/960px-%D0%91%D1%83%D1%82%D0%B0%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4_19.jpg","photoKey":"butakovka"},{"id":"butakovsky-pass","section":"explore","category":"Mountain route","icon":"🥾","title":"Butakovsky Pass","subtitle":"The watershed crossing between Butakovka and Kimasar","meta":["~2,500–2,700 m","exact saddle varies"],"summary":"The pass is the watershed crossing on the Butakovka-to-Kimasar/Medeu traverse, and different tracks can use slightly different saddles.","notice":["Altitude disagreement is partly a mapping and route-choice problem.","The pass marks the shift from one drainage basin into another.","The open ridge gives a clear view of changing vegetation and slope aspect."],"story":"A pass is not only a viewpoint: it is the exact moment where water falling on one side begins a different journey from water falling on the other.","myth":"The pass is a local watershed crossing rather than a documented Silk Road or military pass, and its exact elevation depends on which saddle and track are used.","deep":"The strongest interpretation is geographic: watershed, saddle, altitude and route choice.","tags":["butakovsky pass","watershed","2026 route","kimasar","butakovka"],"image":"images/butakovsky-pass.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/%D0%91%D1%83%D1%82%D0%B0%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4_19.jpg/960px-%D0%91%D1%83%D1%82%D0%B0%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4_19.jpg","photoKey":"butakovka"},{"id":"enthusiasts-meadow","section":"explore","category":"Mountain route","icon":"🌾","title":"Enthusiasts’ Meadow","subtitle":"A local hiking junction in the high meadows","meta":["route junction","Kimasar–Furmanovka–Butakovka"],"summary":"Enthusiasts’ Meadow functions as a route junction and rest landscape linking Kimasar, Furmanovka and Butakovka rather than as a sharply bounded attraction.","notice":["The name is established in local hiking usage.","The meadow sits inside Almaty’s network of weekend ridge routes.","Its exact naming origin was not verified in the available documentation."],"story":"The interesting story is the network itself: Almaty hiking culture grew through clubs, word of mouth and interconnected ridges rather than through a single official trail system.","myth":"The name is well established among local hikers, but a precise story about who first named the meadow and when has not been verified.","deep":"Treat it as a social-geography stop: a named meeting/rest point inside a broader hiking landscape.","tags":["enthusiasts meadow","polyana entuziastov","kimasar","furmanovka","2026 route"],"image":"images/enthusiasts-meadow.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Kok_zhailau.jpg/960px-Kok_zhailau.jpg","photoKey":"kokzhailau"},{"id":"kimasar","section":"explore","category":"Mountain route","icon":"🌲","title":"Kimasar Gorge","subtitle":"The descent side of the Butakovka traverse","meta":["Medeu side","forested gorge"],"summary":"Kimasar forms the eastern side of the traverse back toward Medeu, with ridges connecting it to Furmanovka and Butakovka.","notice":["It is part of the same interconnected weekend-hiking system as Butakovka.","Forest and meadow transitions reflect elevation, moisture and slope aspect.","The gorge is included in current mountain-cluster planning discussions."],"story":"Kimasar helps explain why local hikers think in connected valleys and ridges rather than in isolated attractions.","myth":"Wildlife lives in the wider protected mountain system, but seeing a particular species on a walk through Kimasar is never guaranteed.","deep":"Its value on this trip is mainly route logic, vegetation change and Almaty hiking culture.","tags":["kimasar","gorge","medeu","butakovka","furmanovka","2026 route"],"image":"images/kimasar.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Kok_zhailau.jpg/960px-Kok_zhailau.jpg","photoKey":"kokzhailau"},{"id":"butakovka-traverse","section":"journey","category":"Mountain route","icon":"🥾","title":"Butakovka → Kimasar → Medeu","subtitle":"A full valley-to-valley mountain traverse","meta":["roughly 15–20 km","+900–1,100 m","−1,000–1,300 m"],"summary":"The route climbs Butakovka, passes the upper waterfall, crosses the watershed into high meadow terrain and descends through Kimasar to Medeu.","notice":["The highest point is the watershed/pass area, not the waterfall.","The route crosses stream-cut valleys, rock steps, colluvial slopes and a ridge saddle.","Distance and elevation vary because groups use different starts, ends and saddle lines."],"story":"This traverse stitches together long-used local recreation landscapes; the hiking culture predates today’s resort-expansion plans.","myth":"There is no single permanent official GPX line for this traverse. Start points, end points and the exact saddle can all change the distance and elevation.","deep":"The route is an unusually clear demonstration of altitude zonation, watershed crossing and slope-aspect ecology in one day.","tags":["butakovka","kimasar","medeu","waterfall","pass","2026 route","day 2"],"image":"images/butakovka-traverse.webp","alsoExplore":true,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/%D0%91%D1%83%D1%82%D0%B0%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4_19.jpg/960px-%D0%91%D1%83%D1%82%D0%B0%D0%BA%D0%BE%D0%B2%D1%81%D0%BA%D0%B8%D0%B9_%D0%B2%D0%BE%D0%B4%D0%BE%D0%BF%D0%B0%D0%B4_19.jpg","photoKey":"butakovka"},{"id":"chimbulachka","section":"journey","category":"Mountain route","icon":"⛰️","title":"Chimbulachka Peak","subtitle":"A first high summit above Shymbulak","meta":["~3,450–3,460 m","~250 m ascent from Talgar Pass"],"summary":"Chimbulachka is reached from Talgar Pass along a high ridge above the ski resort, with broad views into glaciated Trans-Ili Alatau terrain.","notice":["It is a classic first high summit for Almaty hikers because lifts remove much of the approach.","Loose scree and broken rock are common.","The summit is useful for explaining lower oxygen pressure, UV and fast-changing weather above 3,000 m."],"story":"Its importance is local rather than expeditionary: it is a training and acclimatisation summit that gives ordinary hikers quick access to a serious high-mountain environment.","myth":"‘Easy from the cable car’ does not mean safe in cloud, high wind, snow or ice.","deep":"The ridge is shaped by frost weathering and sits in alpine-to-nival conditions. Same-day lift operation and surface conditions strongly affect access.","tags":["chimbulachka","peak","talgar pass","shymbulak","2026 route","summit"],"image":"images/chimbulachka.webp","alsoExplore":true,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Shymbulak,_Almaty_(P1180202).jpg/960px-Shymbulak,_Almaty_(P1180202).jpg","photoKey":"shymbulak"},{"id":"golden-man","section":"explore","category":"Archaeology","icon":"🏺","title":"Issyk & the Golden Man","subtitle":"Saka archaeology turned into a national symbol","meta":["5th–4th c. BCE","discovered 1969–70"],"summary":"The famous Issyk burial contained thousands of gold ornaments, weapons and a silver vessel, and later became one of independent Kazakhstan’s strongest national symbols.","notice":["The cemetery lies where mountain valleys meet the steppe.","The richly dressed burial shows elite craft and ritual complexity.","The inscription, sex/status of the buried person and some costume interpretations remain debated."],"story":"The Golden Man has two lives: first as an Iron Age archaeological discovery, and later as one of independent Kazakhstan’s strongest visual symbols.","myth":"The Golden Man is an extraordinary Saka burial, but the sex, exact status and language of the inscription remain debated. Labels such as 'king', 'prince' or 'priestess' are interpretations.","deep":"Archaeological evidence and modern symbolism are two different layers. The burial is Iron Age; its role as a national emblem belongs largely to independent Kazakhstan.","tags":["golden man","issyk","esik","saka","archaeology","history"],"image":"images/golden-man.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Golden_Man,_Almaty_Central_State_Museum_of_Kazakhstan.jpg/960px-Golden_Man,_Almaty_Central_State_Museum_of_Kazakhstan.jpg","photoKey":"golden"},{"id":"ethno-aul","section":"explore","category":"Culture stop","icon":"⛺","title":"Kazakh Ethno Aul","subtitle":"A place to interpret heritage, not freeze it","meta":["curated heritage setting","yurt • food • music"],"summary":"An ethno-aul is a curated cultural setting where traditional architecture, music, food, crafts and pastoral heritage are presented together.","notice":["Pastoral mobility varied by region, season and wealth.","Yurt structure, dombra, horse culture, kumis, tea and hospitality can be explained here.","Contemporary pastoralism is mostly settled or semi-mobile rather than unchanged full nomadism."],"story":"The interesting question here is not 'Is this authentic?' but 'Which parts are living practice, which are ceremonial today, and which have been reconstructed for heritage presentation?'","myth":"An ethno-aul is a curated heritage setting. It presents real cultural elements, but it is not a frozen nineteenth-century village or proof that every Kazakh community lived in exactly the same way.","deep":"Pastoral ecology depended on moving between winter bases, spring and autumn pasture, and high summer zhailau according to snow, water and forage.","tags":["ethno aul","yurt","pastoralism","culture","traditions","zhailau"],"image":"images/ethno-aul.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Shanyraq.jpg/960px-Shanyraq.jpg","photoKey":"yurt"},{"id":"turgen","section":"explore","category":"Mountain valley","icon":"🌲","title":"Turgen Gorge","subtitle":"From settled piedmont to high Assy grasslands","meta":["~1,000 m to >2,500 m","eastern Trans-Ili Alatau"],"summary":"Turgen is a long river corridor leading from settled foothills into high Assy grasslands, with one of the trip’s clearest forest-to-open-plateau transitions.","notice":["Deciduous and fruit vegetation lower down gives way to Schrenk spruce, then subalpine meadow.","Upper Turgen–Assy contains dense multi-period archaeological landscapes.","The gorge links permanent villages with seasonal high pasture."],"story":"The landscape itself tells the story: forested gorge gradually opens into a windy high plateau used for grazing and science.","myth":"Turgen has long been a route through the mountains, but every modern road in the gorge cannot automatically be labelled a major Silk Road route.","deep":"Terraces, water and pasture repeatedly attracted settlement and burial activity, making Turgen a useful geoarchaeology story as well as a scenic drive.","tags":["turgen","gorge","assy","spruce","archaeology","pastoralism"],"image":"images/turgen.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD,_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%BE%D0%B5_%D1%83%D1%89%D0%B5%D0%BB%D1%8C%D0%B5,_%D1%80%D0%B5%D0%BA%D0%B0_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%8C_(3).jpg/960px-%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD,_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%BE%D0%B5_%D1%83%D1%89%D0%B5%D0%BB%D1%8C%D0%B5,_%D1%80%D0%B5%D0%BA%D0%B0_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%8C_(3).jpg","photoKey":"turgen"},{"id":"assy","section":"explore","category":"Pasture & science","icon":"🔭","title":"Assy Plateau","subtitle":"High pasture, archaeology and astronomy","meta":["~2,400–2,800 m","observatory ~2,750 m"],"summary":"Beyond forested Turgen, Assy opens into broad high grasslands with active seasonal grazing and an astronomical observatory.","notice":["Seasonal grazing remains a living practice.","The observatory has operated since the Soviet period.","Treeless high grassland means strong wind, UV and fast storms."],"story":"Assy is a good antidote to the idea of 'unchanged nomadism': herders still use summer pasture, but modern semi-mobile life includes vehicles, permanent winter homes, phones and markets.","myth":"Seasonal grazing on Assy is real and still visible, but modern pastoral life also includes vehicles, permanent homes, phones, schools and markets.","deep":"The plateau combines pastoral ecology, archaeology and dark-sky science; road passability remains weather-dependent.","tags":["assy","plateau","observatory","pastoralism","turgen","zhailau"],"image":"images/assy.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg/960px-%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg","photoKey":"assy"},{"id":"assy-pass","section":"explore","category":"Highland transition","icon":"🛣️","title":"Assy Pass","subtitle":"Where high grassland begins to give way to drier basins","meta":["high road/pass","altitude varies by mapped line"],"summary":"Assy Pass marks a landscape transition from broad high grassland toward drier eastern basins and valleys.","notice":["Mapped pass elevations vary depending on the exact road or saddle line.","The surrounding country is exposed to wind and sudden weather.","The pass is better explained as a landscape threshold than as a famous historical crossing."],"story":"From here the trip begins to feel less like the green mountain front of Almaty and more like the open interior landscapes farther east.","myth":"Assy Pass is a striking landscape transition; a major Silk Road role is not established by the material behind this site.","deep":"The pass works as a visual geography stop: climate, exposure and the direction of drainage begin to change.","tags":["assy pass","plateau","transition","highland","road"],"image":"images/assy-pass.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg/960px-%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg","photoKey":"assy"},{"id":"kara-arsha","section":"explore","category":"Trekking","icon":"⛰️","title":"Kara Arsha Pass","subtitle":"A pass whose altitude depends on what exactly you mean","meta":["KE pass ~2,900 m","KE trek high point ~3,100 m"],"summary":"The key operational point is to separate the named Kara Arsha Pass from the highest point reached on the trek.","notice":["The KE itinerary separates a ~3,100 m high point from a ~2,900 m named pass.","Other gazetteers and maps can label nearby features differently.","The name roughly combines qara, dark/black, with arsha, juniper."],"story":"Altitude disagreement is itself a useful map-reading story: different saddles, GPS vertical error and route high points can all be conflated.","myth":"The itinerary’s highest point and the named pass are not necessarily the same place. That is why different maps and tracks can produce different altitude figures.","deep":"The surrounding terrain is high ridge, grass/soil slopes and scree with neighbouring saddles that can be easy to confuse on maps.","tags":["kara arsha","pass","sary tau","zhenishke","trek","altitude"],"image":"images/kara-arsha.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg/960px-%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg","photoKey":"assy"},{"id":"sary-tau","section":"explore","category":"Trekking","icon":"️","title":"Sary Tau Range","subtitle":"The ridge system between high pasture and Zhenishke","meta":["~2,500–3,300+ m","Kara Arsha–Zhenishke sector"],"summary":"Sary Tau separates valleys and high pastures on the trekking route toward Zhenishke.","notice":["Sary can mean yellow/pale and tau means mountain.","The range forms part of the northern Tien Shan transition landscape.","Ridge travel links open uplands with the descent into more sheltered river valleys."],"story":"The name is simple but useful: Kazakh landscape vocabulary often describes visible colour, landform or use without needing an elaborate legend.","myth":"Sary Tau literally refers to a pale or yellow mountain landscape. One fixed ancient legend behind the colour name has not been established.","deep":"The range is best understood through route geography: divides, grazing landscapes and the change from exposed high terrain into Zhenishke.","tags":["sary tau","mountain","range","kara arsha","zhenishke"],"image":"images/sary-tau.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg/960px-%D0%9F%D0%BB%D0%B0%D1%82%D0%BE_%D0%90%D1%81%D1%81%D1%8B.jpg","photoKey":"assy"},{"id":"zhenishke","section":"explore","category":"Trekking valley","icon":"🏞️","title":"Zhenishke River & Valley","subtitle":"A narrower, more sheltered descent after the high ridges","meta":["river valley","variable crossings"],"summary":"The trekking route drops from open high ridges into a narrower river valley with forest patches, shelter and variable river crossings.","notice":["Жіңішке means narrow or slender.","The valley shows a clear transition away from exposed high grassland.","Crossing number and depth vary with season and recent weather."],"story":"After open ridge country, Zhenishke feels like entering a different ecological room: water, forest patches and shelter become more important.","myth":"River crossings change with snowmelt, storms and season, so their number and depth are never completely fixed.","deep":"The best interpretation combines river dynamics, vegetation change and the way valleys channel human and animal movement.","tags":["zhenishke","zhinishke","river","valley","trek","forest"],"image":"images/zhenishke.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD,_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%BE%D0%B5_%D1%83%D1%89%D0%B5%D0%BB%D1%8C%D0%B5,_%D1%80%D0%B5%D0%BA%D0%B0_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%8C_(3).jpg/960px-%D0%9A%D0%B0%D0%B7%D0%B0%D1%85%D1%81%D1%82%D0%B0%D0%BD,_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%81%D0%BA%D0%BE%D0%B5_%D1%83%D1%89%D0%B5%D0%BB%D1%8C%D0%B5,_%D1%80%D0%B5%D0%BA%D0%B0_%D0%A2%D1%83%D1%80%D0%B3%D0%B5%D0%BD%D1%8C_(3).jpg","photoKey":"turgen"},{"id":"kolsai-park","section":"explore","category":"National park","icon":"🌲","title":"Kolsai Kolderi National Park","subtitle":"Forested mountain valleys, lakes and village tourism","meta":["Kolsai • Kaindy • Saty","protected mountain landscape"],"summary":"The park protects forested mountain valleys containing the three Kolsai lakes and Kaindy, with Saty as the main tourism gateway.","notice":["The broader park is snow-leopard habitat, though sightings are extremely unlikely.","Schrenk spruce forests are one of the defining landscapes.","Tourism, local livelihoods and conservation all occupy the same space."],"story":"The useful story is not 'untouched wilderness' but a lived protected landscape: villages, horses, guesthouses, trails and rare wildlife coexist.","myth":"Kolsai is a protected mountain landscape, but it is also lived in and heavily visited. Rare wildlife habitat does not mean rare animals will be easy to see.","deep":"The park is an excellent place to explain forest ecology, altitude zones, protected-area tourism and border geography.","tags":["kolsai","national park","kaindy","saty","spruce","wildlife"],"image":"images/kolsai-park.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/KZ_Kolsay_Lake.jpg/960px-KZ_Kolsay_Lake.jpg","photoKey":"kolsai"},{"id":"kaindy","section":"explore","category":"Lake","icon":"🌲","title":"Lake Kaindy","subtitle":"The forest that became a lake","meta":["~1,867 m","formed after 1911 earthquake"],"summary":"Kaindy is a landslide-dammed mountain lake created after the 1911 earthquake; its standing tree trunks pre-date the lake.","notice":["The lake formed when slope failure created a natural dam.","The standing trees were already growing before the lake existed.","Kaindy lies in a side valley separate from the three Kolsai lakes."],"story":"The most memorable explanation is simple: the forest did not grow in a lake — the lake arrived around the forest.","myth":"The trees did not grow underwater and the lake is not volcanic.","deep":"Kaindy is a strong field example of how earthquakes, slope failure and natural dams can rapidly create new mountain landscapes.","tags":["kaindy","lake","earthquake","1911","forest","kolsai"],"image":"images/kaindy.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Lake_Kaindy,_Kazakhstan.jpg/960px-Lake_Kaindy,_Kazakhstan.jpg","photoKey":"kaindy"},{"id":"saty","section":"explore","category":"Village","icon":"🏡","title":"Saty Village","subtitle":"The gateway community for Kolsai and Kaindy","meta":["tourism gateway","guesthouse economy"],"summary":"Saty sits between the regional road and the protected valleys, so most Kolsai and Kaindy visitor flows pass through it.","notice":["Tourism is now a major visible part of local livelihoods.","Guesthouses, transport, horse services and food connect village life to the national park economy.","The village is contemporary, not a museum of rural tradition."],"story":"Saty is a good place to explain what tourism does to a village: new income, new traffic, new businesses and new pressure all arrive together.","myth":"Saty is a living contemporary village whose economy is strongly connected to tourism, not an untouched museum of traditional rural life.","deep":"The growth of guesthouses, drivers, horse services and food businesses shows how a protected area can reshape a village economy.","tags":["saty","village","kolsai","kaindy","guesthouse","rural tourism"],"image":"images/saty.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/KZ_Kolsay_Lake.jpg/960px-KZ_Kolsay_Lake.jpg","photoKey":"kolsai"},{"id":"lower-kolsai","section":"explore","category":"Lake","icon":"💧","title":"Lower Kolsai","subtitle":"The most accessible lake and the start of the trail upward","meta":["~1,800 m","trailhead for Middle Kolsai"],"summary":"Lower Kolsai is the most accessible of the three lakes and the usual starting point for the climb toward Middle Kolsai.","notice":["It sits in a forested mountain basin.","Visitor infrastructure is concentrated here compared with the higher lakes.","The trail upward quickly becomes a stronger trekking experience."],"story":"Lower Kolsai shows how accessibility changes a mountain lake: it is both a protected landscape and a busy social space.","myth":"The three Kolsai lakes belong to one mountain system, but their shape, depth and local conditions are different.","deep":"The lower lake is the social and logistical starting point of the lake system; the trail above it quickly becomes steeper, quieter and more alpine.","tags":["lower kolsai","kolsai","lake","trail","spruce"],"image":"images/lower-kolsai.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/KZ_Kolsay_Lake.jpg/960px-KZ_Kolsay_Lake.jpg","photoKey":"kolsai"},{"id":"middle-kolsai","section":"explore","category":"Lake","icon":"💧","title":"Middle Kolsai / Mynzhylky Lake","subtitle":"A higher forest lake with a confusingly familiar name","meta":["~2,250 m","day-hike objective"],"summary":"Middle Kolsai lies several trail kilometres above Lower Kolsai in a steeper forested basin and is also called Mynzhylky in local usage.","notice":["It is a common day-hike or overnight objective.","The higher elevation makes the forest and weather feel noticeably different.","Its alternative name is the reason guides must distinguish two Mynzhylkys on this trip."],"story":"One trip contains two completely different places called Mynzhylky: a high plateau above Shymbulak and this lake in the Kolsai system.","myth":"Middle Kolsai is also called Mynzhylky Lake. It is completely different from Mynzhylky Plateau above Shymbulak.","deep":"The duplicate name Mynzhylky is a useful reminder that place-names repeat: context matters as much as the word itself.","tags":["middle kolsai","mynzhylky lake","kolsai","lake","hike"],"image":"images/middle-kolsai.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/KZ_Kolsay_Lake.jpg/960px-KZ_Kolsay_Lake.jpg","photoKey":"kolsai"},{"id":"upper-kolsai","section":"explore","category":"Lake","icon":"️","title":"Upper Kolsai","subtitle":"The high lake near the Kyrgyzstan frontier","meta":["~2,800–2,900 m","border proximity"],"summary":"Upper Kolsai lies above Middle Kolsai in higher alpine terrain close to the Kazakhstan–Kyrgyzstan frontier.","notice":["The landscape is more alpine and exposed than at the lower lakes.","Border proximity can affect access requirements.","The lake completes the vertical sequence of the three-lake system."],"story":"The higher lake makes political geography visible: the mountain ridge is also an international frontier.","myth":"The mountains beyond Upper Kolsai approach the Kyrgyzstan frontier, but crossing the border through the mountains is not simply an informal extension of the hike.","deep":"Exact border-service requirements can change, so operational rules should always be checked close to a visit.","tags":["upper kolsai","kolsai","lake","border","kyrgyzstan","alpine"],"image":"images/upper-kolsai.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/KZ_Kolsay_Lake.jpg/960px-KZ_Kolsay_Lake.jpg","photoKey":"kolsai"},{"id":"charyn","section":"explore","category":"Canyon","icon":"🏜️","title":"Charyn Canyon & Valley of Castles","subtitle":"A river-cut landscape, not a mini Grand Canyon","meta":["Valley ~1,100–1,300 m","park created 2004"],"summary":"The Charyn River cuts deeply through the eastern Ili Basin; the Valley of Castles is only one visitor sector of a much larger national park.","notice":["Different parts of the canyon expose rocks of very different ages.","Differential erosion shapes towers and walls in softer layered deposits.","Heat and the return climb are often more important to people than technical difficulty."],"story":"Charyn works best as a geology story: uplift, river incision, sediment and erosion produce architecture without architects.","myth":"The claim that Charyn is the world’s 'second-largest canyon after the Grand Canyon' is tourism hyperbole, not a defensible scientific ranking.","deep":"The park also protects semi-desert and riparian habitats, including a relict Sogdian ash forest in another sector.","tags":["charyn","canyon","valley of castles","geology","national park","desert"],"image":"images/charyn.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Charyn_canyon.jpg/960px-Charyn_canyon.jpg","photoKey":"charyn"},{"id":"military-shelters","section":"explore","category":"Unresolved history","icon":"🧱","title":"Old Military Structures","subtitle":"A roadside mystery that should stay a mystery until identified","meta":["exact function unresolved","Charyn/return route"],"summary":"Old concrete military-looking structures appear on the route, but their exact function cannot be established without coordinates, photographs and archival matching.","notice":["They may be connected with Soviet military infrastructure, but the available documentation does not identify them securely.","Roadside appearance is not enough to classify a bunker, silo or missile site.","Saryozek elsewhere on the route has documented missile-elimination history."],"story":"Not every mystery needs a dramatic answer. In this case, the exact function of the structures is still unknown.","myth":"The concrete structures seen along the route look military, but their exact function is still unresolved without precise locations, photographs and archival matching.","deep":"Keep this card deliberately cautious until the exact structures are photographed and geolocated.","tags":["military structures","soviet","bunker","charyn","unresolved"],"image":"images/military-shelters.webp","alsoExplore":false},{"id":"zharkent-city","section":"explore","category":"City","icon":"🏘️","title":"Zharkent","subtitle":"A border and trade town shaped by movement","meta":["eastern Kazakhstan","late-imperial growth"],"summary":"Zharkent’s modern urban development is strongly connected with the late-imperial border and trade period.","notice":["The town sits in a region shaped by movement between Kazakhstan, Xinjiang and the Ili valley.","Uyghur and other communities are important to its cultural history.","Its mosque is the city’s most distinctive heritage landmark."],"story":"Zharkent makes the eastern border feel historical rather than abstract: trade, migration and architecture all reflect movement across the region.","myth":"Zharkent is more than a generic 'Silk Road town'. Its modern character is strongly tied to late-imperial border trade, migration and the Ili region.","deep":"Zharkent connects the mountain route with borderland trade, Uyghur history and the wider Ili corridor.","tags":["zharkent","city","border","trade","uyghur","ili"],"image":"images/zharkent-city.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Zharkent_Mosque_2.jpg/960px-Zharkent_Mosque_2.jpg","photoKey":"zharkent"},{"id":"zharkent-mosque","section":"explore","category":"Architecture","icon":"🕌","title":"Zharkent Mosque","subtitle":"Chinese-influenced carpentry built as a mosque","meta":["late 19th century","Uyghur community patronage"],"summary":"Chinese-influenced construction and Uyghur community patronage are central to the mosque’s history.","notice":["Its architecture differs sharply from many people’ expectations of a mosque.","Wooden construction and decorative language reflect cross-border craft traditions.","The building’s religious use and later historical transformations belong to the same story."],"story":"The surprise works well: a building can look visually 'Chinese' to a visitor and still have been conceived and built as a mosque.","myth":"The building was created as a mosque. Its striking Chinese-influenced carpentry does not mean it began life as a Buddhist or Chinese temple.","deep":"The mosque is one of the strongest architectural examples of how borderland communities combine religious function with regional craft traditions.","tags":["zharkent mosque","mosque","uyghur","architecture","chinese influence"],"image":"images/zharkent-mosque.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Zharkent_Mosque_2.jpg/960px-Zharkent_Mosque_2.jpg","photoKey":"zharkent"},{"id":"ili","section":"explore","category":"River","icon":"🌊","title":"Ili River","subtitle":"The hydrological thread from China to Balkhash","meta":["China–Kazakhstan river","ends in Lake Balkhash"],"summary":"The Ili is a transboundary river linking Tien Shan catchments in China and Kazakhstan with the Ili delta and Lake Balkhash.","notice":["The river supports agriculture, fishing, settlements and recreation.","It connects the mountains to Kapchagai Reservoir, Altyn-Emel and Balkhash.","Water management is shaped by climate, reservoirs, irrigation and cross-border withdrawals."],"story":"Snow and glacier melt from the mountains eventually becomes river water, reservoir water, desert oasis and delta. The Ili connects landscapes that can otherwise feel unrelated.","myth":"The Ili is a shared China–Kazakhstan river, and its water story involves climate, reservoirs, irrigation and upstream use. Simple slogans about one side 'taking all the water' miss that complexity.","deep":"The river is one of the trip’s strongest themes because water links nearly every ecosystem visited.","tags":["ili","river","china","balkhash","water","transboundary"],"image":"images/ili.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Ili_river.jpg/960px-Ili_river.jpg","photoKey":"ili"},{"id":"altyn-emel","section":"explore","category":"National park","icon":"🐎","title":"Altyn-Emel National Park","subtitle":"Desert, archaeology, wildlife and deep geological time","meta":["Ili valley to high mountains","UNESCO serial property component"],"summary":"Altyn-Emel is a huge protected landscape combining desert plains, sedimentary and volcanic mountains, river oases, archaeology and reintroduced ungulates.","notice":["The park is represented within the UNESCO Cold Winter Deserts of Turan serial World Heritage property.","Kulan reintroduction is one of its strongest conservation stories.","Aktau, Katutau and the Singing Dune show completely different geological processes."],"story":"Altyn-Emel is not empty desert: it contains grazing, villages, archaeology, wildlife, tourism routes and landscapes that record millions of years.","myth":"Altyn-Emel is represented within a larger UNESCO serial World Heritage property rather than being one standalone UNESCO site. Przewalski’s horses are also not a routine sighting here.","deep":"Key themes are cold-winter desert ecology, ungulate conservation, palaeontology, aeolian acoustics and protected-area tourism.","tags":["altyn emel","national park","desert","unesco","kulan","wildlife"],"image":"images/altyn-emel.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"basshi","section":"explore","category":"Village","icon":"🏡","title":"Basshi","subtitle":"The eastern gateway to Altyn-Emel","meta":["~600–700 m","park logistics hub"],"summary":"Basshi is the principal logistics gateway for classic eastern Altyn-Emel routes to the Singing Dune, Aktau and Katutau.","notice":["The village’s tourism role expanded with the national park.","It is a normal contemporary rural settlement, not a staged heritage village.","Guesthouses, drivers and park services connect local livelihoods to visitor flows."],"story":"Like Saty, Basshi shows the human geography behind protected landscapes: every 'remote desert' visit depends on a real settlement and local service economy.","myth":"Basshi is a normal contemporary rural settlement and a practical gateway to the national park, not a reconstructed nomad village.","deep":"Its importance is practical and social: national-park routes depend on a real village economy of accommodation, transport and services.","tags":["basshi","baschi","village","altyn emel","tourism","gateway"],"image":"images/basshi.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"aktau","section":"explore","category":"Geology","icon":"🎨","title":"Aktau Mountains","subtitle":"Colourful sediments and fossils in a desert badland","meta":["~700–1,600 m","eastern Altyn-Emel"],"summary":"Aktau is a brightly eroded badland massif built from fossil-bearing Cenozoic sedimentary sequences.","notice":["Aq tau means 'white mountain(s)', referring to pale exposures.","The colours come from different sediment layers and minerals rather than paint-like surface staining.","Erosion cuts the soft deposits into ravines, ridges and sculpted walls."],"story":"Aktau feels like walking through a stack of vanished environments: every exposed layer records a different chapter of the region’s geological past.","myth":"The colours of Aktau come from varied sedimentary layers and minerals. They cannot all be reduced to one simple colour-equals-one-mineral rule.","deep":"The strongest themes are sedimentation, erosion, palaeontology and the contrast between ancient lake/river deposits and today’s arid landscape.","tags":["aktau","mountains","altyn emel","geology","fossils","sediments"],"image":"images/aktau.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"kosbastau-willow","section":"explore","category":"Oasis & legend","icon":"🌳","title":"Kosbastau Oasis & the Old Willow","subtitle":"A real old tree wrapped in a Chinggis Khan story","meta":["age estimate ~700 years","park estimate"],"summary":"Kosbastau is an oasis stop known for a very old willow tree, whose age is commonly given by the park as roughly 700 years.","notice":["The oasis itself matters ecologically in an arid environment.","The tree’s age should be treated as an estimate, not an exact birth date.","A popular story connects the tree with Chinggis Khan’s warriors."],"story":"This is a perfect 'fact and legend' stop: the old tree is real, the age is approximate, and the Chinggis Khan connection belongs to legend rather than documented biography.","myth":"The old willow is real and its age is an estimate. The popular Chinggis Khan connection belongs to legend rather than documented biography.","deep":"In an arid landscape, an oasis concentrates shade, water, wildlife and human movement. That ecological fact is as interesting as the legend around the old tree.","tags":["kosbastau","willow","altyn emel","oasis","chinggis khan","legend"],"image":"images/kosbastau-willow.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"singing-dune","section":"explore","category":"Desert","icon":"🎵","title":"Singing Dune","subtitle":"When moving sand becomes an instrument","meta":["~140 m high in route descriptions","aeolian landscape"],"summary":"Under suitable dry conditions, moving sand on the dune can produce a deep resonant booming sound.","notice":["The sound comes from collective grain movement under particular dry conditions.","The dune remains a distinctive landform despite active wind because local wind and sediment supply interact in a stable system.","The surrounding desert and mountain views are part of the experience."],"story":"The 'singing' is literal rather than poetic: under the right conditions, moving dry sand can create a deep sound that carries across the slope.","myth":"The dune really can produce a deep booming sound, but only under suitable dry sand conditions; some visits are quiet.","deep":"The dune is a natural demonstration of aeolian transport, grain physics and the way wind builds rather than only destroys landscapes.","tags":["singing dune","altyn emel","sand","desert","sound","aeolian"],"image":"images/singing-dune.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%9F%D0%BE%D1%8E%D1%89%D0%B8%D0%B9_%D0%B1%D0%B0%D1%80%D1%85%D0%B0%D0%BD.jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%9F%D0%BE%D1%8E%D1%89%D0%B8%D0%B9_%D0%B1%D0%B0%D1%80%D1%85%D0%B0%D0%BD.jpg","photoKey":"dune"},{"id":"wildlife-altyn","section":"explore","category":"Wildlife","icon":"🦌","title":"Wildlife of Altyn-Emel","subtitle":"Kulan, gazelles and the reality of wildlife spotting","meta":["desert ungulates","sightings never guaranteed"],"summary":"Altyn-Emel is one of the strongest wildlife sections of the trip, especially for kulan and goitered gazelle.","notice":["Kulan reintroduction in the park is well documented.","Foxes, wolves, birds of prey and other desert fauna are part of the wider system.","Presence in the park never guarantees a tourist sighting."],"story":"The kulan story is better than simply listing animals: it shows active conservation and reintroduction rather than a fantasy of untouched wilderness.","myth":"Kulan and gazelles are realistic wildlife possibilities in Altyn-Emel. Przewalski’s horses are not a routine sighting.","deep":"Wildlife is best thought of in probabilities. Kulan are a realistic highlight; other species may be present without appearing on any particular drive.","tags":["wildlife","altyn emel","kulan","gazelle","animals","conservation"],"image":"images/wildlife-altyn.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"besshatyr","section":"explore","category":"Archaeology","icon":"🏺","title":"Besshatyr Burial Mounds","subtitle":"A monumental Saka funerary landscape","meta":["Saka elite necropolis","Altyn-Emel"],"summary":"Besshatyr is an elite Saka funerary landscape consisting of a wider necropolis rather than one single tomb.","notice":["Large burial mounds express labour, hierarchy and ritual landscape.","The site belongs to the same broad Iron Age world that helps contextualise Issyk.","Its location in Altyn-Emel connects archaeology with desert geography."],"story":"Together, Issyk and Besshatyr show that the Golden Man was not an isolated miracle but part of a larger elite archaeological world across Zhetysu.","myth":"Besshatyr is a whole elite Saka funerary landscape, not one single tomb and not simply another version of the Golden Man.","deep":"The scale and arrangement of the mounds reveal hierarchy, labour and ritual use of landscape in the Saka world.","tags":["besshatyr","saka","archaeology","altyn emel","burial mounds"],"image":"images/besshatyr.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"altyn-emel-pass","section":"explore","category":"Return route","icon":"🛣️","title":"Altyn-Emel Pass","subtitle":"The 'Golden Saddle' on the return journey","meta":["~1,470 m in KE itinerary","return route"],"summary":"Altyn-Emel Pass is a road crossing on the return route toward Almaty and is commonly explained as 'Golden Saddle.'","notice":["The pass gives the national park its familiar name.","It marks another transition between mountain and basin landscapes.","Road travel makes the scale of southeastern Kazakhstan visible."],"story":"After days of desert and canyon, the pass is a simple reminder that this trip is built from repeated crossings between basins, ridges and ecological zones.","myth":"Treat colourful naming legends as legends unless specifically documented.","deep":"The pass is mainly useful as a route-geography and place-name stop.","tags":["altyn emel pass","return route","golden saddle","road"],"image":"images/altyn-emel-pass.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg/960px-%D0%90%D0%BB%D1%82%D1%8B%D0%BD-%D0%AD%D0%BC%D0%B5%D0%BB%D1%8C,_%D0%B3%D0%BE%D1%80%D1%8B_%D0%90%D0%BA%D1%82%D0%B0%D1%83_(1).jpg","photoKey":"aktau"},{"id":"saryozek","section":"explore","category":"Soviet heritage","icon":"🚀","title":"Saryozek","subtitle":"A verified Soviet missile-elimination story","meta":["return corridor","INF history"],"summary":"Saryozek has documented Soviet missile-elimination history connected with the INF era.","notice":["It provides a real military-history anchor on the return route.","This verified history should be kept separate from unidentified roadside structures elsewhere.","The settlement also sits on an important transport corridor."],"story":"Saryozek gives the return journey a real Cold War layer: this is one place where military history is documented rather than guessed from roadside ruins.","myth":"Saryozek has documented Cold War missile history, but that history does not automatically identify every concrete structure elsewhere on the route as a missile site.","deep":"Keep the story concise and evidence-based: Cold War military geography is one more Soviet layer in the landscape.","tags":["saryozek","soviet","missile","cold war","return route"],"image":"images/saryozek.webp","alsoExplore":false},{"id":"qonaev-reservoir","section":"explore","category":"Soviet infrastructure","icon":"🌊","title":"Kapchagai Reservoir & Qonaev","subtitle":"A Soviet dam, a renamed city and the Ili water system","meta":["Ili River reservoir","Qonaev renamed 2022"],"summary":"The dam impounds the Ili north of Almaty before the river continues toward its delta and Lake Balkhash.","notice":["The Soviet hydropower project was built around the turn of the 1970s.","Reservoir filling changed downstream hydrology, sediment and evaporation patterns.","The city formerly known as Kapshagay/Kapchagai was renamed Qonaev in 2022."],"story":"This stop connects three time layers in one view: a Soviet mega-project, a post-independence city name and a living environmental debate about the Ili–Balkhash system.","myth":"The reservoir changed Ili River hydrology, but Lake Balkhash is influenced by several forces at once, including climate and upstream water use.","deep":"The reservoir is one of the strongest places to explain hydropower, sediment trapping, evaporation and the politics of water.","tags":["kapchagai","qonaev","reservoir","ili","soviet infrastructure","hydropower"],"image":"images/qonaev-reservoir.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Ili_river.jpg/960px-Ili_river.jpg","photoKey":"ili"},{"id":"who-kazakhs","section":"kazakhstan","category":"Identity","icon":"","title":"Who are the Kazakhs?","subtitle":"A people formed through history, not a timeless fixed tribe","meta":["Turkic-speaking","Kazakh Khanate"],"summary":"Modern Kazakh identity formed through a long process of political and ethnic consolidation, especially in the late medieval and early-modern steppe world.","notice":["The Kazakh Khanate belongs to the post-Mongol Jochid/Golden Horde political world.","The word qazaq existed as a social-political term before becoming a stable ethnonym.","The Three Zhuzes were large socio-territorial groupings containing many tribes."],"story":"A useful answer to 'Are Kazakhs Mongols?' is that Kazakhs are Turkic-speaking, while their historical formation included populations shaped by both Turkic and Mongol-era steppe history.","myth":"The word qazaq existed before it became the stable name of the modern Kazakh people, so the simple translation 'Kazakh means free man' tells only part of the story.","deep":"Genealogy and Zhuz identity can remain culturally meaningful today, but they do not function as three separate peoples or determine ordinary citizenship.","tags":["kazakhs","identity","ethnogenesis","zhuz","kazakh khanate","qazaq"],"image":"images/who-kazakhs.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Traditional_costume_for_Nowruz.JPG/960px-Traditional_costume_for_Nowruz.JPG","photoKey":"nauryz"},{"id":"nomadic-life","section":"kazakhstan","category":"Pastoralism","icon":"🐑","title":"Nomadic Life","subtitle":"Planned mobility, not random wandering","meta":["qystau • kokteu • zhailau • kuzeu","pastoral ecology"],"summary":"Traditional pastoral mobility moved herds between seasonal ecological zones according to water, forage, snow and livestock needs.","notice":["Qystau was the winter base; kokteu spring pasture; zhailau summer pasture; kuzeu autumn pasture.","Mobility varied enormously between mountain Zhetysu, central steppe and southern farming zones.","Wealth, herd size, labour and access to pasture strongly shaped how mobile a household could be."],"story":"Nomadism is better understood as an environmental technology: moving animals at the right time could protect pasture and make use of vegetation that was only seasonally available.","myth":"Kazakh pastoralism was organised seasonal mobility, not random wandering across empty steppe, and different regions developed very different patterns.","deep":"Pastoralists continuously traded with towns and farmers; steppe and city were complementary economies more often than isolated worlds.","tags":["nomadism","pastoralism","zhailau","qystau","livestock","steppe"],"image":"images/nomadic-life.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Shanyraq.jpg/960px-Shanyraq.jpg","photoKey":"yurt"},{"id":"yurt","section":"kazakhstan","category":"Culture","icon":"⛺","title":"The Yurt","subtitle":"A mobile house, not a primitive tent","meta":["kerege","uyq","shanyraq"],"summary":"The Kazakh yurt is a modular felt dwelling engineered for mobility, insulation and rapid assembly.","notice":["Kerege are expandable lattice walls.","Uyq are roof poles.","The shanyraq is the circular crown and can symbolise the household itself."],"story":"The strongest explanation is practical first: walls compress, poles bundle and felt rolls for transport. Symbolism comes after the engineering.","myth":"The shanyraq carries powerful symbolism today, but not every modern cosmic explanation attached to it can be treated as one universal ancient belief.","deep":"The honoured place inside is the tör, opposite the entrance. Layout and decoration varied by region, wealth and period.","tags":["yurt","kiiz ui","shanyraq","kerege","uyq","nomadic life"],"image":"images/yurt.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Shanyraq.jpg/960px-Shanyraq.jpg","photoKey":"yurt"},{"id":"hospitality","section":"kazakhstan","category":"Everyday culture","icon":"☕","title":"Hospitality & Tea","subtitle":"A cultural ideal that still changes by family and generation","meta":["qonaqzhailyq","tör • bata • tea"],"summary":"Hospitality has deep practical roots in a mobile society where travellers could be far from commercial accommodation, but modern urban practice is diverse.","notice":["The tör is the honoured place opposite the entrance in a traditional yurt setting.","Bata is a blessing; shashu, körimdik, süyinshi and other customs survive unevenly.","Repeated tea refilling keeps social interaction going."],"story":"Tea may explain contemporary domestic life better than kumis: people sit, refill, talk, eat and extend the visit through the tea table.","myth":"Small tea pours and repeated refilling are part of social interaction, but there is no single exact liquid level that functions as a universal secret code.","deep":"Hospitality remains a strong cultural ideal, but practice differs by region, family, generation and whether the setting is rural, urban, ceremonial or everyday.","tags":["hospitality","tea","qonaqzhailyq","bata","tör","customs"],"image":"images/hospitality.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Shanyraq.jpg/960px-Shanyraq.jpg","photoKey":"yurt"},{"id":"family-weddings","section":"kazakhstan","category":"Family","icon":"💍","title":"Family, Marriage & Weddings","subtitle":"Older kinship rituals inside a very modern wedding economy","meta":["quda tüsu","qyz uzatu","betashar"],"summary":"Kazakh weddings can combine older kinship rituals, Soviet celebration culture, restaurant economics, social-media performance and post-independence ethnic revival.","notice":["Quda tüsu formalises relations between families.","Qyz uzatu is the bride’s send-off celebration.","Betashar introduces the bride to the groom’s kin and remains culturally important."],"story":"The huge modern banquet-hall wedding is interesting precisely because it is not unchanged medieval tradition — it is a layered modern institution.","myth":"Consensual staged elopement and forced abduction are not the same thing. Forced bride kidnapping is violence and a crime, not a romantic custom.","deep":"Kelin expectations can range from strong household and greeting obligations to almost no special expectations at all, depending on the family.","tags":["wedding","betashar","family","kelin","quda tusu","bride kidnapping"],"image":"images/family-weddings.webp","alsoExplore":false,"remoteImage":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Traditional_costume_for_Nowruz.JPG/960px-Traditional_costume_for_Nowruz.JPG","photoKey":"nauryz"},{"id":"childhood-customs","section":"kazakhstan","category":"Life cycle","icon":"👣","title":"Childhood Customs","subtitle":"Birth, cradle, forty days and first steps","meta":["shildekhana","besikke salu","tusaukeser"],"summary":"Kazakh childhood rituals link family celebration, protection, kinship and symbolic wishes for a child’s future.","notice":["Shildekhana celebrates a birth.","Besikke salu ceremonially places the baby in a traditional cradle.","Tusaukeser marks a child beginning to walk by cutting a symbolic tie around the legs."],"story":"In tusaukeser, a respected active or successful person may be chosen to cut the tie, symbolically giving the child a good road through life.","myth":"Kazakh life-cycle rituals developed through several overlapping Turkic, Islamic, regional and family traditions rather than fitting neatly into 'Islam' or 'Tengriism'.","deep":"The forty-day ritual and other customs share elements with wider Turkic, Islamic, Iranian and Central Asian traditions; modern practice also changes and may be staged publicly.","tags":["childhood","tusaukeser","shildekhana","besik","family","customs"],"image":"images/childhood-customs.webp","alsoExplore":false},{"id":"food","section":"kazakhstan","category":"Food","icon":"🍲","title":"Kazakh Food","subtitle":"Pastoral cuisine — and the food people actually eat today","meta":["et / beshbarmak","qazy","kumis","baursak","tea"],"summary":"Traditional Kazakh cuisine reflects a livestock-based pastoral economy, but everyday food
